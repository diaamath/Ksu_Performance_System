async function readSpreadsheetRows(file){
  const isCSV = /\.(csv|txt)$/i.test(file.name);
  let wb;
  if(isCSV){ wb = XLSX.read(await file.text(), {type:'string', raw:false}); }
  else { wb = XLSX.read(await file.arrayBuffer(), {type:'array', cellDates:true}); }
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, {defval:''});
}

async function startExcelImport(file){
  if(typeof XLSX === 'undefined'){ toast('مكتبة Excel غير متاحة. تحقق من اتصال الإنترنت ثم أعد فتح الصفحة.', 'error'); return; }
  let rows;
  try{ rows = await readSpreadsheetRows(file); }
  catch(err){ console.error('Excel import error:', err); toast(`تعذر قراءة الملف: ${err?.message || 'ملف غير صالح'}`, 'error'); return; }
  if(!rows.length){ toast('الملف فارغ أو لا يحتوي على صفوف بيانات.', 'warn'); return; }

  const keys = Object.keys(rows[0]);
  const map = {};
  IMPORT_COLUMNS.forEach(col=>{ map[col.key] = findHeader(keys, col.aliases); });
  if(!map.studentId || !map.name){
    toast('لم يتم العثور على عمودي «الرقم الجامعي» و«اسم الطالب». استخدم زر «تنزيل القالب» لمعرفة الأعمدة المطلوبة.', 'error'); return;
  }
  const missingCols = IMPORT_COLUMNS.filter(c=>!map[c.key]).map(c=>c.label);
  const records = new Map(); let skipped = 0, dup = 0, badCells = 0;
  const colMax = {}; CRITERIA.forEach(cr=>{ colMax[cr.key] = 0; });
  rows.forEach(row=>{
    const sid = normStudentId(row[map.studentId]);
    const name = String(row[map.name] ?? '').trim();
    if(!sid || !name){ skipped++; return; }
    const scores = {};
    CRITERIA.forEach(cr=>{
      const h = map[cr.key]; let n = h ? toNum(row[h]) : NaN;
      if(h && (!Number.isFinite(n) || n < 0)) badCells++;
      if(!Number.isFinite(n) || n < 0) n = 0;
      scores[cr.key] = n; colMax[cr.key] = Math.max(colMax[cr.key], n);
    });
    if(records.has(sid)) dup++;
    records.set(sid, {studentId:sid, name, scores});
  });
  if(!records.size){ toast('لم يتم العثور على صفوف صالحة (يلزم الرقم الجامعي والاسم).', 'warn'); return; }
  showImportDialog({fileName:file.name, records:[...records.values()], missingCols, skipped, dup, badCells, colMax});
}

      info.skipped ? `<span class="badge b-amber"><span class="dot"></span>${info.skipped} صفوف بلا رقم/اسم تم تجاهلها</span>` : '',
      info.dup ? `<span class="badge b-amber"><span class="dot"></span>${info.dup} أرقام جامعية مكررة (اعتُمد آخر صف)</span>` : '',
      info.badCells ? `<span class="badge b-amber"><span class="dot"></span>${info.badCells} خلية فارغة/غير رقمية عُدّت صفرًا</span>` : '',
    ].join(' ');
    ov.querySelector('#imp_body').innerHTML = `
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">${chips}</div>
      ${info.missingCols.length ? `<div style="background:var(--amber-bg);color:var(--text);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.8;">${ICON.alert} أعمدة غير موجودة في الملف وستُعتبر صفرًا لجميع الطلبة: <b>${info.missingCols.join('، ')}</b></div>` : ''}
      <div class="grid g-2">
        ${inst ? `<div class="field"><label>الشعبة المستهدفة</label><input type="text" disabled value="${escHtml((crs?crs.name:'')+' — شعبة '+(sec?sec.number:''))}"></div>`
               : `<div class="field"><label>الشعبة المستهدفة</label><select id="imp_section">${secs.map(s=>`<option value="${s.id}" ${s.id===target?'selected':''}>${(courseOf(s.courseId)||{}).name||''} — شعبة ${s.number}</option>`).join('')}</select></div>`}
        <div class="field"><label>طريقة الاستيراد</label>
          <select id="imp_mode">
            <option value="merge" ${mode==='merge'?'selected':''}>تحديث الموجودين وإضافة الجدد (يحفظ التدخلات والملاحظات)</option>
            <option value="replace" ${mode==='replace'?'selected':''}>استبدال جميع طلبة الشعبة (${existing} حاليًا)</option>
          </select></div>
      </div>
      <h4 class="font-head" style="font-size:13.5px;margin:6px 0 4px;">الحدود العظمى للمعايير</h4>
      <p class="table-sub" style="margin:0 0 10px;">هذه الحدود تُحوِّل الدرجات الخام إلى نسب (ويمكن تعديل آلية الحساب لاحقًا من صفحة «معايير التقييم»). تأكد أن إجمالي الساعات والدرجات العظمى صحيحة.</p>
      <div class="scrollx"><table><thead><tr><th>المعيار</th><th>أعلى قيمة في الملف</th><th>الحد الأعظم المعتمد</th></tr></thead><tbody>
        ${CRITERIA.map(cr=>{ const cur = scheme.criteria[cr.key].max, fm = info.colMax[cr.key]; const over = fm > cur;
          return `<tr><td><b>${cr.label}</b><div class="table-sub">${cr.maxLabel}</div></td><td>${fmtN(fm)}${over?` <span class="badge b-amber" style="margin-inline-start:6px;"><span class="dot"></span>أعلى من الحد المعتمد</span>`:''}</td>
          <td><input type="number" min="0.5" step="0.5" id="imp_max_${cr.key}" value="${cur}" style="max-width:130px;"></td></tr>`; }).join('')}
      </tbody></table></div>
      <h4 class="font-head" style="font-size:13.5px;margin:18px 0 8px;">معاينة أول ${Math.min(5, info.records.length)} صفوف</h4>
      <div class="scrollx"><table><thead><tr>${IMPORT_COLUMNS.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead><tbody>
        ${info.records.slice(0,5).map(rec=>`<tr><td>${escHtml(rec.studentId)}</td><td>${escHtml(rec.name)}</td>${CRITERIA.map(cr=>`<td>${fmtN(rec.scores[cr.key])}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>`;
    const secSel = ov.querySelector('#imp_section'); if(secSel) secSel.onchange = ()=>{ target = secSel.value; mode = ov.querySelector('#imp_mode').value; draw(); };
    ov.querySelector('#imp_mode').onchange = e=>{ mode = e.target.value; };
  }
  draw();

  ov.querySelector('#imp_ok').onclick = ()=>{
    mode = ov.querySelector('#imp_mode').value;
    const maxes = {}; let bad = false;
    CRITERIA.forEach(cr=>{ const v = parseFloat(ov.querySelector('#imp_max_'+cr.key).value); maxes[cr.key] = v; if(!(v > 0)) bad = true; });
    if(bad){ toast('أدخل حدًا أعظم صحيحًا (أكبر من صفر) لكل معيار.', 'error'); return; }
    const sec = sectionOf(target);
    const sc = cloneJSON(getScheme(target)); let changed = false;
    CRITERIA.forEach(cr=>{ if(sc.criteria[cr.key].max !== maxes[cr.key]){ sc.criteria[cr.key].max = maxes[cr.key]; changed = true; } });
    if(changed) saveScheme(target, sc);
    if(mode === 'replace') DB.data.students = DB.data.students.filter(s=>s.sectionId !== target);
    const idx = new Map(DB.data.students.filter(s=>s.sectionId===target).map(s=>[String(s.studentId), s]));
    let added = 0, updated = 0;
    info.records.forEach(rec=>{
      const ex = idx.get(rec.studentId);
      if(ex){ ex.name = rec.name; ex.scores = rec.scores; updated++; }
      else { DB.data.students.push({ id:uid('stu'), studentId:rec.studentId, name:rec.name, courseId:sec.courseId, sectionId:target, level:'السنة الأولى المشتركة',
                scores:rec.scores, comment:'', notes:'', interventions:[], createdAt:daysAgoISO(0) }); added++; }
    });
    DB.data.auditLogs.unshift({id:uid('log'), time:daysAgoISO(0), user:S.user.name, action:`استيراد ملف Excel إلى الشعبة ${sec.number} (${added} جديد، ${updated} محدَّث)`});
    trackUpdate('استيراد ملف Excel', `شعبة ${sec.number}: ${info.records.length} طالب`);
    if(!currentInstructor()) S.studentFilters.sectionId = target;
    S.studentPage = 1;
    DB.save();
    ov.remove();
    renderRoute();
    toast(`تم الاستيراد: ${added} طالبًا جديدًا و${updated} محدَّثًا${changed?' — وتم تحديث الحدود العظمى للمعايير':''}.`);
  };
}

/* ================================ Cloud Sync + Instructor Update Tracking ================================ */
const SYNC = {
  url:'https://YOUR-PROJECT-default-rtdb.firebaseio.com',   // <-- put your Firebase URL here
  ready:false, timer:null, lastHash:'',
  on(){ return !!this.url && !this.url.includes('https://mayar-91252-default-rtdb.firebaseio.com/'); },
  async req(path, method, body){
    const r = await fetch(this.url + path + '.json', {
      method, headers:{'Content-Type':'application/json'},
      body: body===undefined ? undefined : JSON.stringify(body)
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  },
  schedulePush(){
    if(!this.on() || !S.user) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(()=> this.push().catch(e=>console.error('sync push',e)), 600);
  },
  async push(){
    const d = DB.data;
    if(S.user.role==='admin'){
      const bySec = {};
      d.students.forEach(s=>{ (bySec[s.sectionId] = bySec[s.sectionId] || []).push(s); });
      await this.req('/base','PUT',{
        courses:d.courses, sections:d.sections, instructors:d.instructors,
        users:d.users, settings:d.settings, auditLogs:d.auditLogs.slice(0,100)
      });
      await this.req('/students','PUT',bySec);
      await this.req('/schemes','PUT',d.schemes||{});
      this.ready = true;
    } else if(this.ready){
      const inst = currentInstructor(); if(!inst) return;
      await this.req('/students/'+inst.sectionId,'PUT', d.students.filter(s=>s.sectionId===inst.sectionId));
      if(d.schemes && d.schemes[inst.sectionId]) await this.req('/schemes/'+inst.sectionId,'PUT', d.schemes[inst.sectionId]);
    }
  },
  async pull(){
    if(!this.on()) return false;
    const all = await this.req('','GET');
    if(!all || !all.base){ this.ready = false; return false; }
    const h = JSON.stringify(all);
    this.ready = true;
    if(h === this.lastHash) return false;
    this.lastHash = h;
    const b = all.base, d = DB.data;
    ['courses','sections','instructors','users'].forEach(k=> d[k] = Object.values(b[k]||{}));
    d.settings = b.settings || d.settings;
    d.auditLogs = Object.values(b.auditLogs||{});
    if(all.schemes) d.schemes = all.schemes;
    d.students = Object.values(all.students||{}).flatMap(a=> Object.values(a||{})).map(s=>{
      s.interventions = Object.values(s.interventions||{});
      ensureScores(s);
      return s;
    });
    d.updates = Object.values(all.updates||{}).sort((a,b)=> b.time.localeCompare(a.time)).slice(0,300);
    try{ localStorage.setItem(DB.KEY, JSON.stringify(d)); }catch(e){}
    if(S.user){ S.user = d.users.find(u=>u.id===S.user.id) || S.user; }
    return true;
  }
};

function trackUpdate(action, target){
  const inst = currentInstructor(); if(!inst) return;
  const e = { id:uid('upd'), time:new Date().toISOString(), instructorId:inst.id, instructorName:inst.name,
              courseId:inst.courseId, sectionId:inst.sectionId, action, target:target||'' };
  DB.data.updates = DB.data.updates || [];
  DB.data.updates.unshift(e);
  if(SYNC.on()) SYNC.req('/updates','POST',e).catch(err=>console.error('track',err));
}

function fmtDateTime(iso){
  try{ return new Date(iso).toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'}); }catch(e){ return iso; }
}

function instructorUpdatesCard(){
  const ups = DB.data.updates || [];
  const rows = DB.data.instructors.map(i=>{
    const mine = ups.filter(u=>u.instructorId===i.id);
    return { i, c:courseOf(i.courseId), sec:sectionOf(i.sectionId), last:mine[0], n:mine.length,
             stu:DB.data.students.filter(s=>s.sectionId===i.sectionId).length };
  });
  return `<div class="card" style="padding:18px;margin-bottom:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap;">
      <h3 class="font-head" style="margin:0;font-size:15px;">آخر تحديثات بيانات المدرسين (inst)</h3>
      <span class="badge ${SYNC.on()?'b-green':'b-amber'}"><span class="dot"></span>${SYNC.on()?'مزامنة سحابية مفعّلة':'المزامنة غير مفعّلة'}</span>
    </div>
    <div class="scrollx"><table class="responsive-cards">
      <thead><tr><th>المدرس</th><th>المقرر / الشعبة</th><th>عدد الطلبة</th><th>آخر تحديث</th><th>آخر عملية</th><th>عدد التحديثات</th></tr></thead>
      <tbody>${rows.map(({i,c,sec,last,n,stu})=>`<tr style="cursor:default;">
        <td data-label="المدرس"><div class="table-name">${i.name}</div><div class="table-sub">${i.username}</div></td>
        <td data-label="المقرر">${c?c.name:''} — ${sec?sec.number:''}</td>
        <td data-label="الطلبة">${stu}</td>
        <td data-label="آخر تحديث">${last?fmtDateTime(last.time):'<span class="table-sub">لا يوجد</span>'}</td>
        <td data-label="آخر عملية">${last?(last.action+(last.target?' — '+last.target:'')):'—'}</td>
        <td data-label="التحديثات">${n}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    ${ups.length?`<div class="divider"></div>
    <div style="font-weight:700;font-size:13px;margin-bottom:6px;">أحدث العمليات</div>
    ${ups.slice(0,8).map(u=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;">
      <span><b>${u.instructorName}</b> — ${u.action}${u.target?': '+u.target:''}</span>
      <span class="table-sub">${fmtDateTime(u.time)}</span></div>`).join('')}`:''}
  </div>`;
}

/* auto-refresh every 20s (skips if a form/modal is open or the user is typing) */
setInterval(async ()=>{
  if(!S.user || !SYNC.on()) return;
  if(document.querySelector('.overlay')) return;
  const a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  try{ if(await SYNC.pull()) renderRoute(); }catch(e){ console.error('sync pull',e); }
}, 20000);

/* ================================ Boot ================================ */
DB.load();
render();
SYNC.pull().then(changed=>{ if(changed) render(); }).catch(e=>console.error('sync pull',e));
</script>

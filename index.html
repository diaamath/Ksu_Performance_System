  };
}

/* ---------------- CSV / Excel Import and Export Handlers (Full Reset) ---------------- */
function normalizeExcelHeader(value){
  return String(value ?? '')
    .trim()
    .toLowerCase()
    .replace(/[أإآ]/g,'ا')
    .replace(/ة/g,'ه')
    .replace(/[ًٌٍَُِّْـ]/g,'')
    .replace(/\s+/g,' ');
}

function excelValue(row, aliases){
  const keys = Object.keys(row);
  for(const alias of aliases){
    const a = normalizeExcelHeader(alias);
    const key = keys.find(k=>normalizeExcelHeader(k)===a);
    if(key !== undefined && row[key] !== undefined && row[key] !== null && String(row[key]).trim()!=='') return row[key];
  }
  return '';
}

function parsePercentValue(v, fallback=0){
  const n = parseFloat(String(v ?? '').replace('%','').trim());
  return Number.isFinite(n) ? n : fallback;
}

function parseScoreValue(v, fallback=0){
  const m = String(v ?? '').trim().match(/^\s*(-?\d+(?:\.\d+)?)\s*(?:\/\s*(\d+(?:\.\d+)?))?\s*$/);
  if(!m) return fallback;
  return parseFloat(m[1]);
}

function exportStudentsExcel(students){
  if(typeof XLSX === 'undefined'){
    exportStudentsCSVFallback(students);
    toast('تم تصدير البيانات بصيغة CSV لأن مكتبة Excel غير متاحة.', 'warn');
    return;
  }
  if(!students || !students.length){
    toast('لا توجد بيانات طلاب لتصديرها.', 'warn');
    return;
  }
  const rows = students.map(s=>{
    const r=classify(s);
    const c=courseOf(s.courseId);
    const sec=sectionOf(s.sectionId);
    const actAvg=Math.round((Number(s.activities?.activity||0)+Number(s.activities?.assignment||0)+Number(s.activities?.participation||0))/3);
    const evalAvg=Math.round((Number(s.evaluation?.score||0)+Number(s.evaluation?.participation||0)+Number(s.evaluation?.engagement||0))/3);
    return {
      'الرقم الجامعي': s.studentId ?? '',
      'الاسم': s.name ?? '',
      'المقرر': c?.name ?? '',
      'الشعبة': sec?.number ?? '',
      'المدرس': instructorOf(sec?.instructorId)?.name ?? '',
      'نسبة الحضور': `${r.attRate}%`,
      'الأنشطة': `${actAvg}%`,
      'التمارين': `${s.exercises?.pct ?? 0}%`,
      'المنتصف': `${s.midterm?.score ?? 0}/${s.midterm?.max ?? 40}`,
      'تقييم المدرس': `${evalAvg}%`,
      'الحالة': STATUS_LABEL[r.status] ?? r.status ?? ''
    };
  });
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:18},{wch:30},{wch:32},{wch:12},{wch:22},{wch:16},{wch:14},{wch:14},{wch:14},{wch:18},{wch:20}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'الطلبة');
  XLSX.writeFile(wb,`تقرير_معيار_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast(`تم تصدير ${rows.length} طالبًا إلى ملف Excel بنجاح`);
}

function exportStudentsCSVFallback(students){
  if(!students || !students.length){ toast('لا توجد بيانات طلاب لتصديرها.', 'warn'); return; }
  const esc=v=>`"${String(v ?? '').replace(/"/g,'""')}"`;
  const lines=[];
  lines.push(['الرقم الجامعي','الاسم','المقرر','الشعبة','المدرس','نسبة الحضور','الأنشطة','التمارين','المنتصف','تقييم المدرس','الحالة'].map(esc).join(','));
  students.forEach(s=>{
    const r=classify(s), c=courseOf(s.courseId), sec=sectionOf(s.sectionId), inst=instructorOf(sec?.instructorId);
    const actAvg=Math.round((Number(s.activities?.activity||0)+Number(s.activities?.assignment||0)+Number(s.activities?.participation||0))/3);
    const evalAvg=Math.round((Number(s.evaluation?.score||0)+Number(s.evaluation?.participation||0)+Number(s.evaluation?.engagement||0))/3);
    lines.push([s.studentId,s.name,c?.name||'',sec?.number||'',inst?.name||'',`${r.attRate}%`,`${actAvg}%`,`${s.exercises?.pct||0}%`,`${s.midterm?.score||0}/${s.midterm?.max||40}`,`${evalAvg}%`,STATUS_LABEL[r.status]||r.status].map(esc).join(','));
  });
  const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=`تقرير_معيار_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function exportCSV(students){
  exportStudentsExcel(students);
}

async function handleExcelImport(file){
  if(typeof XLSX === 'undefined'){
    toast('مكتبة Excel غير متاحة. تحقق من اتصال الإنترنت ثم أعد فتح الصفحة.', 'error');
    return;
  }
  try{
    const isCSV = /\.(csv|txt)$/i.test(file.name);
    let rows=[];
    if(isCSV){
      const text=await file.text();
      const wb=XLSX.read(text,{type:'string',raw:false});
      const ws=wb.Sheets[wb.SheetNames[0]];
      rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    }else{
      const data=await file.arrayBuffer();
      const wb=XLSX.read(data,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    }

    if(!rows.length){ toast('الملف فارغ أو لا يحتوي على صفوف بيانات.', 'warn'); return; }

    const newCoursesMap = new Map();
    const newSectionsMap = new Map();
    const newInstructorsMap = new Map();
    const newStudents = [];
    let addedCount = 0;

    rows.forEach((row, idx)=>{
      const studentId = String(excelValue(row,['الرقم الجامعي','الرقم','رقم الطالب','student id','studentid','id'])||'').trim();
      const name = String(excelValue(row,['الاسم','اسم الطالب','اسم','student name','studentname','name'])||'').trim();
      if(!studentId || !name) return;

      let courseName = String(excelValue(row,['المقرر','اسم المقرر','course','course name'])||'مقرر عام').trim();
      let courseCode = String(excelValue(row,['رمز المقرر','course code','code'])||('10'+(newCoursesMap.size+1))).trim();
      let secNumber = String(excelValue(row,['الشعبة','رقم الشعبة','section','section number'])||'101').trim();
      let instrName = String(excelValue(row,['المدرس','عضو هيئة التدريس','المعلم','instructor','teacher'])||'د. مدرس مقرر').trim();

      let courseKey = normalizeExcelHeader(courseName);
      let courseObj = newCoursesMap.get(courseKey);
      if(!courseObj){
        courseObj = { id: uid('c'), code: courseCode, name: courseName, desc: 'مقرر مستورد من ملف Excel', active: true };
        newCoursesMap.set(courseKey, courseObj);
      }

      let instrKey = normalizeExcelHeader(instrName);
      let instrObj = newInstructorsMap.get(instrKey);
      if(!instrObj){
        let instId = uid('inst');
        instrObj = {
          id: instId, name: instrName, username: 'inst_'+(newInstructorsMap.size+1), password:'1234',
          email:'inst_'+(newInstructorsMap.size+1)+'@ksu.edu.sa', courseId: courseObj.id, sectionId: '',
          role:'instructor', status:'active', lastLogin: daysAgoISO(0),
          kpis:{ lectures: 92, plan: 90, officeHours: 88, grading: 90, submission: 95 }
        };
        newInstructorsMap.set(instrKey, instrObj);
      }

      let secKey = courseObj.id+'_'+secNumber;
      let secObj = newSectionsMap.get(secKey);
      if(!secObj){
        secObj = { id: uid('sec'), courseId: courseObj.id, number: secNumber, instructorId: instrObj.id, semester: 'الأول', year: '1447هـ', status: 'active' };
        newSectionsMap.set(secKey, secObj);
        if(!instrObj.sectionId) instrObj.sectionId = secObj.id;
      }

      const attendance = parsePercentValue(excelValue(row,['نسبة الحضور','الحضور','attendance']),85);
      const activities = parsePercentValue(excelValue(row,['الأنشطة','activities','activity']),75);
      const exercises = parsePercentValue(excelValue(row,['التمارين','exercises','exercise']),75);
      const midtermRaw = String(excelValue(row,['المنتصف','الاختبار النصفي','midterm'])||'');
      const midtermScore = parseScoreValue(midtermRaw, 25);
      const midtermMax = parseScoreValue(midtermRaw.match(/\/\s*(\d+(?:\.\d+)?)/)?.[1] || '40', 40);
      const evaluation = parsePercentValue(excelValue(row,['تقييم المدرس','التقييم','evaluation','instructor evaluation']),80);

      const total = 28;
      const attended = Math.round((attendance/100)*total);

      newStudents.push({
        id: uid('stu'),
        studentId,
        name,
        courseId: courseObj.id,
        sectionId: secObj.id,
        level: 'السنة الأولى المشتركة',
        attendance:{ total, attended, absent: Math.max(0, total-attended) },
        activities:{ activity: activities, assignment: activities, participation: activities },
        exercises:{ avg: exercises, weak: 0, pct: exercises },
        midterm:{ score: midtermScore, max: midtermMax },
        evaluation:{ score: evaluation, participation: evaluation, engagement: evaluation, comment: 'تمت إعادة التهيئة والاستيراد من ملف Excel' },
        notes: 'مستورد وفق المدخلات الجديدة',
        interventions: [],
        history: buildFlatHistory(),
        createdAt: daysAgoISO(0)
      });
      addedCount++;
    });

    if(newStudents.length > 0){
      DB.data.courses = Array.from(newCoursesMap.values());
      DB.data.sections = Array.from(newSectionsMap.values());
      DB.data.instructors = Array.from(newInstructorsMap.values());
      DB.data.students = newStudents;
      
      DB.data.users = [
        DB.data.users.find(u=>u.role==='admin') || {id:'admin1', name:'إدارة النظام', username:'admin', password:'admin123', role:'admin', email:'admin@ksu.edu.sa', status:'active', lastLogin:daysAgoISO(0)},
        ...DB.data.instructors.map(i=>({id:i.id, name:i.name, username:i.username, password:i.password, role:'instructor', email:i.email, status:i.status, lastLogin:i.lastLogin, courseId:i.courseId, sectionId:i.sectionId}))
      ];

      DB.save();
      renderRoute();
      toast(`تمت إعادة التهيئة بنجاح واستيراد ${addedCount} طالبًا مع المقررات والشعب والمدرسين الجدد!`);
    } else {
      toast('لم يتم العثور على بيانات صالحة في الملف. تأكد من وجود أعمدة الرقم الجامعي والاسم.', 'warn');
    }
  }catch(err){
    console.error('Excel import error:', err);
    toast(`تعذر قراءة الملف: ${err?.message || 'ملف غير صالح'}`,'error');
  }
}

/* ================================ Cloud Sync + Instructor Update Tracking ================================ */
const SYNC = {
  url:'https://YOUR-PROJECT-default-rtdb.firebaseio.com',   // <-- put your Firebase URL here
  ready:false, timer:null, lastHash:'',
  on(){ return !!this.url && !this.url.includes('https://mayar-91252-default-rtdb.firebaseio.com/'); },
  async req(path, method, body){
    const r = await fetch(this.url + path + '.json', {
      method, headers:{'Content-Type':'application/json'},
      body: body===undefined ? undefined : JSON.stringify(body)
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  },
  schedulePush(){
    if(!this.on() || !S.user) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(()=> this.push().catch(e=>console.error('sync push',e)), 600);
  },
  async push(){
    const d = DB.data;
    if(S.user.role==='admin'){
      const bySec = {};
      d.students.forEach(s=>{ (bySec[s.sectionId] = bySec[s.sectionId] || []).push(s); });
      await this.req('/base','PUT',{
        courses:d.courses, sections:d.sections, instructors:d.instructors,
        users:d.users, settings:d.settings, auditLogs:d.auditLogs.slice(0,100)
      });
      await this.req('/students','PUT',bySec);
      this.ready = true;
    } else if(this.ready){
      const inst = currentInstructor(); if(!inst) return;
      await this.req('/students/'+inst.sectionId,'PUT', d.students.filter(s=>s.sectionId===inst.sectionId));
    }
  },
  async pull(){
    if(!this.on()) return false;
    const all = await this.req('','GET');
    if(!all || !all.base){ this.ready = false; return false; }
    const h = JSON.stringify(all);
    this.ready = true;
    if(h === this.lastHash) return false;
    this.lastHash = h;
    const b = all.base, d = DB.data;
    ['courses','sections','instructors','users'].forEach(k=> d[k] = Object.values(b[k]||{}));
    d.settings = b.settings || d.settings;
    d.auditLogs = Object.values(b.auditLogs||{});
    d.students = Object.values(all.students||{}).flatMap(a=> Object.values(a||{})).map(s=>{
      s.interventions = Object.values(s.interventions||{});
      s.history = Object.values(s.history||{});
      return s;
    });
    d.updates = Object.values(all.updates||{}).sort((a,b)=> b.time.localeCompare(a.time)).slice(0,300);
    try{ localStorage.setItem(DB.KEY, JSON.stringify(d)); }catch(e){}
    if(S.user){ S.user = d.users.find(u=>u.id===S.user.id) || S.user; }
    return true;
  }
};

function trackUpdate(action, target){
  const inst = currentInstructor(); if(!inst) return;
  const e = { id:uid('upd'), time:new Date().toISOString(), instructorId:inst.id, instructorName:inst.name,
              courseId:inst.courseId, sectionId:inst.sectionId, action, target:target||'' };
  DB.data.updates = DB.data.updates || [];
  DB.data.updates.unshift(e);
  if(SYNC.on()) SYNC.req('/updates','POST',e).catch(err=>console.error('track',err));
}

function fmtDateTime(iso){
  try{ return new Date(iso).toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'}); }catch(e){ return iso; }
}

function instructorUpdatesCard(){
  const ups = DB.data.updates || [];
  const rows = DB.data.instructors.map(i=>{
    const mine = ups.filter(u=>u.instructorId===i.id);
    return { i, c:courseOf(i.courseId), sec:sectionOf(i.sectionId), last:mine[0], n:mine.length,
             stu:DB.data.students.filter(s=>s.sectionId===i.sectionId).length };
  });
  return `<div class="card" style="padding:18px;margin-bottom:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap;">
      <h3 class="font-head" style="margin:0;font-size:15px;">آخر تحديثات بيانات المدرسين (inst)</h3>
      <span class="badge ${SYNC.on()?'b-green':'b-amber'}"><span class="dot"></span>${SYNC.on()?'مزامنة سحابية مفعّلة':'المزامنة غير مفعّلة'}</span>
    </div>
    <div class="scrollx"><table class="responsive-cards">
      <thead><tr><th>المدرس</th><th>المقرر / الشعبة</th><th>عدد الطلبة</th><th>آخر تحديث</th><th>آخر عملية</th><th>عدد التحديثات</th></tr></thead>
      <tbody>${rows.map(({i,c,sec,last,n,stu})=>`<tr style="cursor:default;">
        <td data-label="المدرس"><div class="table-name">${i.name}</div><div class="table-sub">${i.username}</div></td>
        <td data-label="المقرر">${c?c.name:''} — ${sec?sec.number:''}</td>
        <td data-label="الطلبة">${stu}</td>
        <td data-label="آخر تحديث">${last?fmtDateTime(last.time):'<span class="table-sub">لا يوجد</span>'}</td>
        <td data-label="آخر عملية">${last?(last.action+(last.target?' — '+last.target:'')):'—'}</td>
        <td data-label="التحديثات">${n}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    ${ups.length?`<div class="divider"></div>
    <div style="font-weight:700;font-size:13px;margin-bottom:6px;">أحدث العمليات</div>
    ${ups.slice(0,8).map(u=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;">
      <span><b>${u.instructorName}</b> — ${u.action}${u.target?': '+u.target:''}</span>
      <span class="table-sub">${fmtDateTime(u.time)}</span></div>`).join('')}`:''}
  </div>`;
}

/* auto-refresh every 20s (skips if a form/modal is open or the user is typing) */
setInterval(async ()=>{
  if(!S.user || !SYNC.on()) return;
  if(document.querySelector('.overlay')) return;
  const a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  try{ if(await SYNC.pull()) renderRoute(); }catch(e){ console.error('sync pull',e); }
}, 20000);

/* ================================ Boot ================================ */
DB.load();
render();
SYNC.pull().then(changed=>{ if(changed) render(); }).catch(e=>console.error('sync pull',e));
</script>

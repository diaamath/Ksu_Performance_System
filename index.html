<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title> Miyar </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F0F4F8;
  --surface:#FFFFFF;
  --surface-2:#E2E8F0;
  --border:#CBD5E1;
  --text:#0F172A;
  --text-muted:#475569;
  --primary-900:#001F3F;
  --primary-800:#003366;
  --primary-700:#004080;
  --primary-600:#0055A5;
  --primary-500:#0066CC;
  --primary-100:#E6F0FA;
  --gold-700:#003366;
  --gold-500:#0055A5;
  --gold-100:#E6F0FA;
  --green:#10B981;      --green-bg:#D1FAE5;
  --amber:#F59E0B;      --amber-bg:#FEF3C7;
  --red:#EF4444;        --red-bg:#FEE2E2;
  --gray:#64748B;       --gray-bg:#F1F5F9;
  --shadow:0 1px 2px rgba(0,31,63,.06), 0 6px 20px -6px rgba(0,31,63,.10);
  --radius:14px;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B132B; --surface:#1C2541; --surface-2:#24305E; --border:#3A506B;
    --text:#F0F4F8; --text-muted:#94A3B8;
    --primary-100:#1D3557; --gold-100:#1D3557;
    --green-bg:#132A13; --amber-bg:#332708; --red-bg:#3A1B17; --gray-bg:#1E293B;
  }
}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Tajawal', 'Cairo', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.font-head{font-family:'Cairo','Tajawal',system-ui,sans-serif;}
::selection{background:var(--primary-100);}
a{color:inherit;}
button{font-family:inherit;}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

/* ---------- layout ---------- */
#app{min-height:100%;}
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:264px; flex:0 0 264px; background:linear-gradient(180deg,var(--primary-900),var(--primary-800));
  color:#E2E8F0; position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto;
  padding:18px 14px; display:flex; flex-direction:column; gap:6px; z-index:40;
}
.sidebar-brand{display:flex; align-items:center; gap:12px; padding:8px 8px 18px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:10px;}
.sidebar-brand .mark{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--gold-500),#3399FF);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;box-shadow:0 4px 14px rgba(0,85,165,.35); color:#fff;}
.sidebar-brand .txt{line-height:1.25;}
.sidebar-brand .txt b{font-family:'Cairo';font-weight:800;font-size:15px;display:block;}
.sidebar-brand .txt span{font-size:11.5px;color:#B0C4DE;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; cursor:pointer;
  color:#CBD5E1; font-size:14px; font-weight:600; transition:background .15s,color .15s; user-select:none;
}
.nav-item svg{width:18px;height:18px;flex:0 0 auto;opacity:.9;}
.nav-item:hover{background:rgba(255,255,255,.08); color:#fff;}
.nav-item.active{background:rgba(255,255,255,.14); color:#fff; box-shadow:inset 3px 0 0 #3399FF;}
.nav-sec{font-size:11px; color:#94A3B8; font-weight:700; margin:14px 8px 4px; letter-spacing:.02em;}
.sidebar-foot{margin-top:auto; padding:10px 8px; font-size:11px; color:#94A3B8; border-top:1px solid rgba(255,255,255,.1);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border); z-index:30; display:flex; align-items:center; gap:12px;
  padding-inline:18px; padding-bottom:12px;
}
.topbar .grow{flex:1;}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);transition:.15s;}
.icon-btn:hover{background:var(--surface-2); color:var(--text);}
.icon-btn svg{width:17px;height:17px;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;min-width:220px;max-width:340px;}
.search-box input{border:none;background:transparent;outline:none;font-size:13.5px;color:var(--text);width:100%;}
.search-box svg{width:16px;height:16px;color:var(--text-muted);flex:0 0 auto;}
.avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary-600),var(--primary-900));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;font-family:'Cairo';}
.mobile-menu-btn{display:none;}
.content{padding:20px; flex:1;}
.breadcrumb{font-size:12.5px;color:var(--text-muted);margin-bottom:6px;display:flex;gap:6px;align-items:center;}
.page-title{font-family:'Cairo';font-weight:800;font-size:22px;margin:0 0 3px;}
.page-desc{color:var(--text-muted);font-size:13.5px;margin:0 0 18px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;}

/* ---------- cards / kpi ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.grid{display:grid;gap:14px;}
.g-4{grid-template-columns:repeat(4,1fr);}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.g-4{grid-template-columns:repeat(2,1fr);} .g-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.g-4,.g-3,.g-2{grid-template-columns:1fr;}}

.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;}
.kpi .top{display:flex;align-items:center;justify-content:space-between;}
.kpi .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.kpi .ic svg{width:19px;height:19px;}
.kpi .val{font-family:'Cairo';font-weight:800;font-size:26px;line-height:1;}
.kpi .lbl{font-size:12.5px;color:var(--text-muted);font-weight:600;}
.kpi .delta{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px;width:fit-content;padding:2px 8px;border-radius:99px;}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;}
.badge .dot{width:7px;height:7px;border-radius:99px;}
.b-green{background:var(--green-bg);color:var(--green);}
.b-amber{background:var(--amber-bg);color:var(--amber);}
.b-red{background:var(--red-bg);color:var(--red);}
.b-gray{background:var(--gray-bg);color:var(--gray);}
.b-green .dot{background:var(--green);} .b-amber .dot{background:var(--amber);} .b-red .dot{background:var(--red);} .b-gray .dot{background:var(--gray);}

.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
.progress > div{height:100%;border-radius:99px;transition:width .4s ease;}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid transparent;transition:transform .08s ease, background .15s, box-shadow .15s;white-space:nowrap;}
.btn svg{width:16px;height:16px;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-primary{background:linear-gradient(135deg,var(--primary-600),var(--primary-800));color:#fff;box-shadow:0 6px 16px -6px rgba(0,85,165,.55);}
.btn-primary:hover{box-shadow:0 8px 20px -6px rgba(0,85,165,.65);}
.btn-gold{background:linear-gradient(135deg,var(--gold-500),var(--gold-700));color:#fff;box-shadow:0 6px 16px -6px rgba(0,51,102,.5);}
.btn-outline{background:var(--surface);border-color:var(--border);color:var(--text);}
.btn-outline:hover{background:var(--surface-2);}
.btn-ghost{background:transparent;color:var(--text-muted);}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);}
.btn-danger{background:var(--red-bg);color:var(--red);}
.btn-danger:hover{background:#f4d4cf;}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:8px;}
.btn-loading{position:relative;color:transparent !important;pointer-events:none;}
.btn-loading::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;animation:spin .7s linear infinite;}
.btn-outline.btn-loading::after{border-color:rgba(0,0,0,.2);border-top-color:var(--text);}
@keyframes spin{to{transform:rotate(360deg);}}

.iconbtn-sm{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);}
.iconbtn-sm:hover{background:var(--surface-2);color:var(--text);}
.iconbtn-sm svg{width:14.5px;height:14.5px;}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{position:sticky;top:0;background:var(--surface-2);text-align:right;padding:11px 14px;font-weight:700;color:var(--text-muted);font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:hover{background:var(--surface-2);}
tbody tr{cursor:pointer;}
.table-name{font-weight:700;}
.table-sub{color:var(--text-muted);font-size:12px;}

/* ---------- forms ---------- */
label{font-size:12.5px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:6px;}
.field{margin-bottom:14px;}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 12px;font-size:13.5px;outline:none;transition:border-color .15s, box-shadow .15s;font-family:inherit;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary-500);box-shadow:0 0 0 3px var(--primary-100);}
textarea{resize:vertical;min-height:76px;}
.input-icon-wrap{position:relative;}
.input-icon-wrap input{padding-left:40px;}
.input-icon-wrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);cursor:pointer;}
.input-icon-wrap .ic svg{width:17px;height:17px;}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;}
@media(max-width:880px){.login-wrap{grid-template-columns:1fr;}}
.login-hero{background:radial-gradient(1200px 700px at 20% -10%, #004080 0%, var(--primary-800) 45%, var(--primary-900) 100%);color:#fff;padding:52px 46px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
.login-hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,.08) 1px, transparent 0),radial-gradient(2px 2px at 90px 120px, rgba(255,255,255,.06) 1px, transparent 0),radial-gradient(2px 2px at 160px 60px, rgba(255,255,255,.07) 1px, transparent 0);background-size:200px 200px;opacity:.6;}
@media(max-width:880px){.login-hero{padding:36px 26px;}}
.login-form-side{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--bg);}
.login-card{width:100%;max-width:380px;}
.demo-box{background:var(--gold-100);border:1px dashed var(--gold-500);border-radius:12px;padding:12px 14px;font-size:12px;color:#003366;margin-top:16px;line-height:1.9;}

/* ---------- misc ---------- */
.divider{height:1px;background:var(--border);margin:16px 0;}
.tag-pill{padding:3px 10px;background:var(--surface-2);border-radius:99px;font-size:11.5px;font-weight:700;color:var(--text-muted);}
.empty{text-align:center;padding:50px 20px;color:var(--text-muted);}
.empty svg{width:44px;height:44px;margin-bottom:10px;opacity:.5;}
.stepper-track{display:flex;align-items:center;margin-bottom:22px;}
.step-dot{width:30px;height:30px;border-radius:50%;background:var(--surface-2);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;font-family:'Cairo';border:2px solid var(--border);flex:0 0 auto;transition:.2s;}
.step-dot.done{background:var(--primary-600);border-color:var(--primary-600);color:#fff;}
.step-dot.current{border-color:var(--primary-600);color:var(--primary-700);background:var(--primary-100);}
.step-line{flex:1;height:2px;background:var(--border);margin:0 4px;}
.step-line.done{background:var(--primary-600);}
.step-label{font-size:10.5px;color:var(--text-muted);text-align:center;margin-top:6px;width:64px;}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,31,63,.45);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.modal{background:var(--surface);border-radius:16px;box-shadow:0 20px 60px -12px rgba(0,0,0,.35);width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;animation:pop .18s ease;}
.modal.modal-lg{max-width:760px;}
@keyframes pop{from{transform:scale(.96);opacity:0;} to{transform:scale(1);opacity:1;}}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-body{padding:20px;overflow-y:auto;}
.modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;padding-bottom:env(safe-area-inset-bottom,0px);width:min(92vw,380px);}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px -8px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;animation:slideUp .2s ease;}
@keyframes slideUp{from{transform:translateY(10px);opacity:0;} to{transform:translateY(0);opacity:1;}}
.toast .ic{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.toast .ic svg{width:13px;height:13px;}

.mobile-scrim{display:none;}
@media(max-width:900px){
  .sidebar{position:fixed; inset-inline-start:0; top:0; transform:translateX(105%); transition:transform .22s ease; box-shadow:0 0 40px rgba(0,0,0,.3);}
  [dir=rtl] .sidebar{transform:translateX(105%);}
  .sidebar.open{transform:translateX(0);}
  .mobile-menu-btn{display:flex;}
  .search-box{display:none;}
  .mobile-scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39;}
  .content{padding:14px;}
  table thead{display:none;}
  .responsive-cards tbody tr{display:block;border-bottom:8px solid var(--bg);}
  .responsive-cards tbody td{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);}
  .responsive-cards tbody td::before{content:attr(data-label);font-weight:700;color:var(--text-muted);font-size:12px;}
}
.hide-mobile{display:inline-flex;}
@media(max-width:640px){.hide-mobile{display:none;}}

/* ---------- scheme editor / reports (معايير التقييم) ---------- */
.crit-card{padding:18px;}
.crit-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.crit-desc{background:var(--primary-100);color:var(--text);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.9;margin-top:4px;}
.crit-preview{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:13px;}
.crit-preview input{width:110px;}
.band-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:12.5px;}
.band-row input{width:84px;}
.crit-err{color:var(--red);font-size:12px;font-weight:700;margin-top:4px;}
.mono{font-family:ui-monospace,Consolas,monospace;direction:ltr;text-align:left;}
.scheme-table td,.scheme-table th{vertical-align:top;}

@media print{
  .sidebar,.topbar,.no-print,.page-head,.breadcrumb,.mobile-scrim,#toastWrap{display:none !important;}
  .shell,.main{display:block !important;}
  .content{padding:0 !important;}
  body{background:#fff;}
  .card{box-shadow:none !important;}
  body:has(#studentModal) .shell{display:none !important;}
  #studentModal{position:static !important;background:none !important;padding:0 !important;}
  #studentModal .modal{box-shadow:none !important;max-height:none !important;max-width:100% !important;}
  #studentModal .modal-foot,#studentModal .icon-btn{display:none !important;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toastWrap" class="toast-wrap"></div>

<script>
/* =======================================================================
    نظام معيار (Miyar) — تقييم ومتابعة الأداء الأكاديمي
    جامعة الملك سعود — السنة الأولى المشتركة — قسم العلوم الأساسية
    ======================================================================= */

const ICON = {

  users:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  book:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  grad:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>',
  chart:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>',

/* ---------------- Seeded PRNG for stable demo data ---------------- */
function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(20260919);
function ri(a,b){return Math.floor(rnd()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(rnd()*arr.length)];}
function uid(p){return p+'_'+Math.random().toString(36).slice(2,9);}

const CRITERIA = [
  {key:'attendance', label:'الحضور',          raw:'عدد ساعات الحضور',    unit:'ساعة',  maxLabel:'إجمالي ساعات المقرر'},

  {key:'homework',   label:'الواجب الورقي',   raw:'درجة الواجب الورقي',  unit:'درجة', maxLabel:'الدرجة العظمى للواجب الورقي'},
  {key:'midterm',    label:'اختبار المنتصف',  raw:'درجة المنتصف',        unit:'درجة', maxLabel:'الدرجة العظمى لاختبار المنتصف'},
  {key:'evaluation', label:'تقييم المدرس',    raw:'تقييم المدرس',        unit:'درجة', maxLabel:'الدرجة العظمى لتقييم المدرس'},

const METHODS = {
  linear:{ label:'نسبي مباشر' },
  cap:   { label:'نسبي مع حدّ إتقان' },
  bands: { label:'شرائح (مستويات)' },
  deduct:{ label:'خصم من الدرجة الكاملة' },
  custom:{ label:'معادلة مخصصة' },
};
function n0(v){ const n = parseFloat(v); return Number.isFinite(n) ? n : 0; }
function fmtN(n){ const v = Math.round(n0(n)*10)/10; return String(v); }
function escHtml(s){ return String(s ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function cloneJSON(o){ return JSON.parse(JSON.stringify(o)); }

function defaultCriterion(weight, max){
  return { weight, max, method:'linear', capPct:80, perUnit: max>0 ? Math.round(weight/max*100)/100 : 1, formula:'w * p',
           bands:[{min:90,pct:100},{min:75,pct:85},{min:60,pct:70},{min:50,pct:55},{min:0,pct:0}] };
}
const DEFAULT_SCHEME = { criteria:{
  attendance: defaultCriterion(15,30),
  activities: defaultCriterion(10,10),
  exercises:  defaultCriterion(15,15),
  homework:   defaultCriterion(10,10),
  midterm:    defaultCriterion(30,30),
  evaluation: defaultCriterion(20,20),
}};

const FORMULA_FUNCS = { min:Math.min, max:Math.max, sqrt:Math.sqrt, abs:Math.abs, round:Math.round, floor:Math.floor, ceil:Math.ceil, pow:Math.pow, iff:(c,a,b)=>(c?a:b) };
const _formulaCache = new Map();
function compileFormula(src){
  let s = String(src ?? '').trim();
  if(!s) throw new Error('المعادلة فارغة');
  s = s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/،/g,',').replace(/×/g,'*').replace(/÷/g,'/').replace(/\bif\s*\(/g,'iff(');
  if(s.length > 200) throw new Error('المعادلة طويلة جدًا');
  if(_formulaCache.has(s)) return _formulaCache.get(s);
  const allowed = new Set(['x','m','w','p', ...Object.keys(FORMULA_FUNCS)]);
  for(const id of (s.match(/[A-Za-z_]\w*/g) || [])){ if(!allowed.has(id)) throw new Error('رمز غير مسموح في المعادلة: '+id); }
  if(/[^0-9A-Za-z_+\-*/%().,<>=!&|?:\s]/.test(s)) throw new Error('المعادلة تحتوي على رموز غير مسموحة');
  if(/[^0-9]\.|\.[^0-9]/.test(s)) throw new Error('صيغة الأرقام العشرية غير صحيحة');
  if(s.replace(/===|!==|==|!=|<=|>=/g,'').includes('=')) throw new Error('علامة = غير مسموحة (استخدم == للمقارنة)');
  let fn;
  try{ fn = new Function('x','m','w','p','F','"use strict"; const {min,max,sqrt,abs,round,floor,ceil,pow,iff}=F; return ('+s+');'); }
  catch(e){ throw new Error('صيغة المعادلة غير صحيحة'); }
  _formulaCache.set(s, fn);
  return fn;
}
function runFormula(src, vars){
  try{
    const fn = compileFormula(src);
    const v = fn(vars.x, vars.m, vars.w, vars.p, FORMULA_FUNCS);
    if(typeof v !== 'number' || !Number.isFinite(v)) return {error:'ناتج المعادلة ليس رقمًا صالحًا'};
    return {value:v};
  }catch(e){ return {error: e.message || 'خطأ في المعادلة'}; }
}

function evalCriterion(c, raw){
  const w = Math.max(0, n0(c.weight)), m = n0(c.max);
  const x = Math.max(0, n0(raw));
  const p = m > 0 ? x/m : 0;
  let earned = 0, err = null;
  switch(c.method){
    case 'cap': {
      const cp = Math.min(100, Math.max(1, n0(c.capPct) || 100))/100;
      earned = Math.min(p/cp, 1) * w; break;
    }
    case 'bands': {
      const pp = p*100;
      const bs = (Array.isArray(c.bands)? c.bands : []).slice().sort((a,b)=>n0(b.min)-n0(a.min));
      const hit = bs.find(b=> pp >= n0(b.min) - 1e-9);
      earned = hit ? (n0(hit.pct)/100) * w : 0; break;
    }
    case 'deduct': {
      earned = w - Math.max(0, m - x) * n0(c.perUnit); break;
    }
    case 'custom': {
      const r = runFormula(c.formula, {x, m, w, p});
      if(r.error){ err = r.error; earned = 0; } else earned = r.value;
      break;
    }
    default: earned = Math.min(p, 1) * w;
  }
  if(!Number.isFinite(earned)) earned = 0;
  earned = Math.round(Math.max(0, Math.min(w, earned))*100)/100;
  return { earned, weight:w, pct: w>0 ? earned/w*100 : 0, p, err };
}

function describeCriterion(c){
  const w = fmtN(c.weight), m = fmtN(c.max);
  const name = (METHODS[c.method] || METHODS.linear).label;
  let lines = [];
  switch(c.method){
    case 'cap':
      lines = [`درجة كاملة (${w}) عند بلوغ ${fmtN(c.capPct)}% من ${m}، وتناسبيًا قبل ذلك: (الدرجة ÷ (${m} × ${fmtN(c.capPct)}%)) × ${w}`]; break;
    case 'bands': {
      const bs = (Array.isArray(c.bands)? c.bands : []).slice().sort((a,b)=>n0(b.min)-n0(a.min));
      lines = bs.map(b=>`إذا بلغت النسبة ≥ ${fmtN(b.min)}% من ${m} ← ${fmtN(b.pct)}% من الوزن (${fmtN(n0(c.weight)*n0(b.pct)/100)})`);
      if(!lines.length) lines = ['لا توجد شرائح معرّفة']; break;
    }
    case 'deduct':
      lines = [`${w} − ((${m} − الدرجة) × ${fmtN(c.perUnit)})، وبحدّ أدنى صفر`]; break;
    case 'custom':
      lines = [`المعادلة: ${c.formula}  (x = الدرجة الخام، m = الحد الأعظم ${m}، w = الوزن ${w}، p = x ÷ m)`]; break;
    default:
      lines = [`(الدرجة ÷ ${m}) × ${w}`];
  }
  return { name, lines, html: lines.map(escHtml).join('<br>'), plain: lines.join('؛ ') };
}

const _schemeCache = new WeakMap();
let _defaultSchemeNorm = null;
function normalizeScheme(sc){
  const out = cloneJSON(DEFAULT_SCHEME);
  if(!sc || !sc.criteria) return out;
  CRITERIA.forEach(cr=>{
    const src = sc.criteria[cr.key]; if(!src) return;
    const d = out.criteria[cr.key];
    ['weight','max','capPct','perUnit'].forEach(f=>{ if(src[f] !== undefined && src[f] !== '' && Number.isFinite(parseFloat(src[f]))) d[f] = parseFloat(src[f]); });
    if(METHODS[src.method]) d.method = src.method;
    if(typeof src.formula === 'string' && src.formula.trim()) d.formula = src.formula;
    if(src.bands){
      const arr = Array.isArray(src.bands) ? src.bands : Object.values(src.bands);
      const clean = arr.filter(b=>b && Number.isFinite(parseFloat(b.min)) && Number.isFinite(parseFloat(b.pct))).map(b=>({min:parseFloat(b.min), pct:parseFloat(b.pct)}));
      if(clean.length) d.bands = clean;
    }
  });
  out.updatedAt = sc.updatedAt; out.updatedBy = sc.updatedBy;
  return out;
}
function getScheme(sectionId){
  const raw = DB.data && DB.data.schemes ? DB.data.schemes[sectionId] : null;
  if(!raw){ if(!_defaultSchemeNorm) _defaultSchemeNorm = normalizeScheme(null); return _defaultSchemeNorm; }
  let n = _schemeCache.get(raw);
  if(!n){ n = normalizeScheme(raw); _schemeCache.set(raw, n); }
  return n;
}
function saveScheme(sectionId, scheme){
  const copy = cloneJSON(scheme);
  copy.updatedAt = new Date().toISOString();
  copy.updatedBy = S.user ? S.user.name : '';
  DB.data.schemes = DB.data.schemes || {};
  DB.data.schemes[sectionId] = copy;
  DB.save();
}

function ensureScores(s){
  if(!s || s.scores) return s;
  const a=s.attendance||{}, ac=s.activities||{}, ex=s.exercises||{}, mi=s.midterm||{}, ev=s.evaluation||{};
  const D = DEFAULT_SCHEME.criteria;
  const pc = (p,k)=> Math.round(n0(p)/100*D[k].max*2)/2;
  s.scores = {
    attendance: a.total ? Math.round(n0(a.attended)/a.total*D.attendance.max) : 0,
    activities: pc((n0(ac.activity)+n0(ac.assignment)+n0(ac.participation))/3,'activities'),
    exercises:  pc(ex.pct,'exercises'),
    homework:   pc(ac.assignment,'homework'),
    midterm:    mi.max ? Math.round(n0(mi.score)/mi.max*D.midterm.max*2)/2 : 0,
    evaluation: pc((n0(ev.score)+n0(ev.participation)+n0(ev.engagement))/3,'evaluation'),
  };
  if(s.comment === undefined) s.comment = ev.comment || '';
  delete s.attendance; delete s.activities; delete s.exercises; delete s.midterm; delete s.evaluation; delete s.history;
  return s;
}

function weightedPick(pairs){ const r=rnd(); let acc=0; for(const [k,w] of pairs){acc+=w; if(r<=acc) return k;} return pairs[pairs.length-1][0]; }
function daysAgoISO(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

function classify(student, settings){
  settings = settings || DB.data.settings;
  const scheme = getScheme(student.sectionId);
  const raw = student.scores || {};
  const cA = scheme.criteria.attendance;
  const attRate = cA.max > 0 ? Math.max(0, Math.min(100, n0(raw.attendance)/cA.max*100)) : 100;
  const parts = {}; let earned = 0, totalW = 0;
  CRITERIA.forEach(cr=>{
    const r = evalCriterion(scheme.criteria[cr.key], raw[cr.key]);
    parts[cr.key] = r; earned += r.earned; totalW += r.weight;
  });
  const score = totalW > 0 ? earned/totalW*100 : 0;
  const base = { score: Math.round(score), attRate: Math.round(attRate), parts, earned, totalW, scheme };
  if(attRate <= settings.grayAttendanceMax) return Object.assign({status:'gray'}, base, {score: Math.round(score)});
  const status = score >= settings.greenMin ? 'green' : (score >= settings.yellowMin ? 'yellow' : 'red');
  return Object.assign({status}, base);
}

const STATUS_SHORT = {green:'أخضر', yellow:'أصفر', red:'أحمر', gray:'رمادي'};

}

function scopedStudents(){
  const inst = currentInstructor();

function computeStats(students){
  const c={green:0,yellow:0,red:0,gray:0};
  let attSum=0;
  students.forEach(s=>{ const r=classify(s); c[r.status]++; attSum += r.attRate; });
  const total = students.length||1;
  return {
    total: students.length, ...c,
    greenPct: Math.round(c.green/total*100), yellowPct: Math.round(c.yellow/total*100),
    redPct: Math.round(c.red/total*100), grayPct: Math.round(c.gray/total*100),
    avgAttendance: students.length? Math.round(attSum/students.length):0
  };
}

function toast(msg, type='success'){
  const wrap = document.getElementById('toastWrap');
  const icon = type==='success'?ICON.check: type==='error'?ICON.x : type==='warn'?ICON.alert:ICON.info;
  const color = type==='success'?'var(--green)':type==='error'?'var(--red)':type==='warn'?'var(--amber)':'var(--primary-600)';
  const bg = type==='success'?'var(--green-bg)':type==='error'?'var(--red-bg)':type==='warn'?'var(--amber-bg)':'var(--primary-100)';
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `<span class="ic" style="background:${bg};color:${color}">${icon}</span><span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s, transform .25s'; el.style.opacity='0'; el.style.transform='translateY(8px)'; setTimeout(()=>el.remove(),250); }, 3200);
}

      </div>
      <div class="modal-foot" style="justify-content:center;">
        <button class="btn btn-outline" id="cdCancel">إلغاء</button>

    </div>`;
  document.body.appendChild(ov);

}

function wireLogin(){
  const btn=document.getElementById('loginBtn');
  const submit=()=> doLogin(document.getElementById('loginUser').value.trim(), document.getElementById('loginPass').value, btn);
  btn.onclick = submit;
  ['loginUser','loginPass'].forEach(id=> document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); }));
  document.getElementById('togglePass').onclick = ()=>{
    const p = document.getElementById('loginPass');
    const isPass = p.type==='password'; p.type = isPass?'text':'password';
    document.getElementById('togglePass').innerHTML = isPass? ICON.eyeOff: ICON.eye;
  };

function kpiCard(icon,label,value,tone,delta){
  const tones = {primary:['var(--primary-100)','var(--primary-700)'],gold:['var(--gold-100)','var(--gold-700)'],green:['var(--green-bg)','var(--green)'],amber:['var(--amber-bg)','var(--amber)'],red:['var(--red-bg)','var(--red)'],gray:['var(--gray-bg)','var(--gray)']};
  const [bg,fg] = tones[tone]||tones.primary;
  return `<div class="card kpi">
    <div class="top"><div class="ic" style="background:${bg};color:${fg}">${icon}</div>${delta?`<span class="delta" style="background:${bg};color:${fg}">${delta}</span>`:''}</div>
    <div class="val">${value}</div><div class="lbl">${label}</div>
  </div>`;
}

    <div class="progress"><div style="width:${pct}%;background:${colors[tone]};"></div></div>

function alertsList(students, limit){
  const withStatus = students.map(s=>({s, r:classify(s)})).filter(x=>x.r.status==='red'||x.r.status==='gray');
  withStatus.sort((a,b)=> (a.r.status==='gray'?0:1) - (b.r.status==='gray'?0:1) || a.r.score-b.r.score);
  const list = withStatus.slice(0,limit||withStatus.length);
  if(!list.length) return `<div class="empty">${ICON.check}<div>لا توجد تنبيهات عاجلة حاليًا</div></div>`;
  return list.map(({s,r})=>{
    const c = courseOf(s.courseId), sec = sectionOf(s.sectionId);
    return `<div class="alert-row" data-student="${s.id}" style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer;">

  }).join('');

function studentsView(){
  const inst = currentInstructor();
  const base = scopedStudents();
  const f = S.studentFilters;
  const rows = base.map(s=>({s, r:classify(s)}));
  let list = rows.filter(({s,r})=>{
    if(f.q && !(s.name.includes(f.q)||String(s.studentId).includes(f.q))) return false;
    if(f.status!=='all' && r.status!==f.status) return false;
    if(!inst && f.sectionId!=='all' && s.sectionId!==f.sectionId) return false;
    return true;
  });
  const pageSize=10; const totalPages=Math.max(1,Math.ceil(list.length/pageSize));
  S.studentPage = Math.min(S.studentPage,totalPages);
  const pageList = list.slice((S.studentPage-1)*pageSize, S.studentPage*pageSize);

  return `
  <div class="card" style="padding:14px 16px;margin-bottom:14px;">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      <div class="search-box" style="min-width:220px;"><span>${ICON.search}</span><input id="stuSearch" placeholder="ابحث بالاسم أو الرقم الجامعي" value="${escHtml(f.q)}"></div>

    </div>
  </div>
  <div class="card">
    <div class="scrollx"><table class="responsive-cards">
      <thead><tr><th>الرقم الجامعي</th><th>اسم الطالب</th>${CRITERIA.map(cr=>`<th>${cr.label}</th>`).join('')}<th>المجموع</th><th>الحالة</th></tr></thead>
      <tbody>
      ${pageList.length? pageList.map(({s,r})=>{
        const crs = courseOf(s.courseId);
        const sec = sectionOf(s.sectionId);
        return `<tr data-student="${s.id}">
          <td data-label="الرقم الجامعي">${escHtml(s.studentId)}</td>
          <td data-label="الاسم"><div class="table-name">${escHtml(s.name)}</div><div class="table-sub">${crs?crs.name:''} — ${sec?sec.number:''}</div></td>
          ${CRITERIA.map(cr=>`<td data-label="${cr.label}">${critCell(cr,s,r)}</td>`).join('')}

        </tr>`;
      }).join('') : `<tr><td colspan="${CRITERIA.length+4}"><div class="empty">${ICON.search}<div>لا توجد نتائج مطابقة — يمكنك استيراد ملف Excel بالزر أعلاه</div></div></td></tr>`}

    </table></div>
  </div>`;
}

  {key:'attendance', label:'عدد ساعات الحضور',    aliases:['عدد ساعات الحضور','ساعات الحضور','عدد الساعات','الحضور','attendance hours','attendance']},
  {key:'activities', label:'درجة الأنشطة',        aliases:['درجة الأنشطة','درجة الانشطة','الأنشطة','الانشطة','activities','activity']},
  {key:'exercises',  label:'درجة التمارين',       aliases:['درجة التمارين','التمارين','exercises','exercise']},
  {key:'homework',   label:'درجة الواجب الورقي',   aliases:['درجة الواجب الورقي','الواجب الورقي','درجة الواجب','الواجب','homework']},
  {key:'midterm',    label:'درجة المنتصف',        aliases:['درجة المنتصف','درجة اختبار المنتصف','المنتصف','الاختبار النصفي','midterm']},
  {key:'evaluation', label:'تقييم المدرس',        aliases:['تقييم المدرس','تقييم المدرّس','التقييم','evaluation']},
  {key:'instructor', label:'اسم المدرس',        aliases:['اسم المدرس','اسم المدرس','المدرس','المدرّس','الأستاذ','instructor','teacher']},
  {key:'course',     label:'المقرر',            aliases:['المقرر','اسم المقرر','course']},
  {key:'section',    label:'الشعبة',            aliases:['الشعبة','رقم الشعبة','section']}
];

function findHeader(keys, aliases){
  for(const a of aliases){
    const n = String(a).trim().toLowerCase();
    const k = keys.find(x=>String(x).trim().toLowerCase()===n);
    if(k !== undefined) return k;
  }
  return null;
}
function toNum(v){
  const n = parseFloat(String(v ?? '').replace(/[^\d.-]/g,''));
  return Number.isFinite(n) ? n : 0;
}
function normStudentId(v){
  return String(v ?? '').trim().replace(/\.0+$/,'');
}

async function readSpreadsheetRows(file){
  const isCSV = /\.(csv|txt)$/i.test(file.name);
  let wb;
  if(isCSV){ wb = XLSX.read(await file.text(), {type:'string', raw:false}); }
  else { wb = XLSX.read(await file.arrayBuffer(), {type:'array', cellDates:true}); }
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, {defval:''});
}

async function startExcelImport(file){
  if(typeof XLSX === 'undefined'){ toast('مكتبة Excel غير متاحة.', 'error'); return; }
  let rows;
  try{ rows = await readSpreadsheetRows(file); }
  catch(err){ toast('تعذر قراءة الملف', 'error'); return; }
  if(!rows.length){ toast('الملف فارغ', 'warn'); return; }

  const keys = Object.keys(rows[0]);
  const map = {};
  IMPORT_COLUMNS.forEach(col=>{ map[col.key] = findHeader(keys, col.aliases); });

  if(!map.studentId || !map.name){
    toast('يرجى التأكد من توفر عمودي «الرقم الجامعي» و«اسم الطالب»', 'error');
    return;
  }

  // إعادة تهيئة كاملة وتحديث المقررات والشعب وأسماء المدرسين تلقائياً بناءً على الملف المدخل
  const coursesMap = new Map();
  const sectionsMap = new Map();
  const instructorsMap = new Map();
  const studentsList = [];

  rows.forEach((row)=>{
    const studentId = normStudentId(row[map.studentId]);
    const name = String(row[map.name] || '').trim();
    if(!studentId || !name) return;

    const instName = map.instructor && row[map.instructor] ? String(row[map.instructor]).trim() : 'مدرس المقرر';
    const courseName = map.course && row[map.course] ? String(row[map.course]).trim() : 'المقرر العام';
    const secNumber = map.section && row[map.section] ? String(row[map.section]).trim() : '101';

    let course = [...coursesMap.values()].find(c=>c.name===courseName);
    if(!course){
      const cid = 'c_' + Math.random().toString(36).slice(2,7);
      course = {id:cid, code:'GEN', name:courseName, desc:'مقرر مستورد من ملف البيانات', active:true};
      coursesMap.set(cid, course);
    }

    let instructor = [...instructorsMap.values()].find(i=>i.name===instName);
    if(!instructor){
      const iid = 'inst_' + Math.random().toString(36).slice(2,7);
      instructor = {id:iid, name:instName, username:'inst_'+iid, password:'123', email:'inst@ksu.edu.sa', role:'instructor', status:'active', lastLogin:daysAgoISO(0), kpis:{lectures:90,plan:90,officeHours:90,grading:90,submission:90}};
      instructorsMap.set(iid, instructor);
    }

    let section = [...sectionsMap.values()].find(s=>s.courseId===course.id && s.number===secNumber);
    if(!section){
      const sid = 'sec_' + Math.random().toString(36).slice(2,7);
      section = {id:sid, courseId:course.id, number:secNumber, instructorId:instructor.id, semester:'الأول', year:'1447هـ', status:'active'};
      sectionsMap.set(sid, section);
      instructor.courseId = course.id;
      instructor.sectionId = section.id;
    }

    const scores = {};
    CRITERIA.forEach(cr=>{
      const colKey = map[cr.key];
      scores[cr.key] = colKey ? toNum(row[colKey]) : 0;
    });

    studentsList.push({
      id: uid('stu'),
      studentId,
      name,
      courseId: course.id,
      sectionId: section.id,
      level: 'السنة الأولى المشتركة',
      scores,
      comment: 'تم الاستيراد تلقائياً من الملف',
      notes: '',
      interventions: [],
      createdAt: daysAgoISO(0)
    });
  });

  if(!studentsList.length){
    toast('لم يتم العثور على أي بيانات طلاب صالحة للاستيراد.', 'error');
    return;
  }

  DB.data.courses = [...coursesMap.values()];
  DB.data.instructors = [...instructorsMap.values()];
  DB.data.sections = [...sectionsMap.values()];
  DB.data.students = studentsList;
  DB.data.schemes = {};
  DB.data.sections.forEach(sec=>{ DB.data.schemes[sec.id] = cloneJSON(DEFAULT_SCHEME); });

  DB.save();
  render();
  toast(`تم استيراد ${studentsList.length} طالبًا، وتحديث المقررات والشعب وأسماء المدرسين بنجاح!`);
}

function exportStudentsExcel(students){
  if(!students || !students.length){ toast('لا توجد بيانات طلاب للتصدير.', 'warn'); return; }
  const rows = students.map(s=>{
    const c = courseOf(s.courseId), sec = sectionOf(s.sectionId), sc = s.scores || {};
    const row = {};
    row['الرقم الجامعي'] = s.studentId ?? '';
    row['اسم الطالب'] = s.name ?? '';
    CRITERIA.forEach(cr=>{ row[IMPORT_COLUMNS.find(x=>x.key===cr.key).label] = n0(sc[cr.key]); });
    row['المقرر'] = c?.name ?? '';
    row['الشعبة'] = sec?.number ?? '';
    row['اسم المدرس'] = instructorOf(sec?.instructorId)?.name ?? '';
    return row;
  });
  if(typeof XLSX === 'undefined'){ toast('مكتبة Excel غير متاحة.', 'error'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الطلبة');
  wb.Workbook = { Views:[{RTL:true}] };
  XLSX.writeFile(wb, `تقرير_معيار_${daysAgoISO(0)}.xlsx`);
  toast('تم التصدير بنجاح');
}

function downloadStudentsTemplate(){
  if(typeof XLSX === 'undefined'){ toast('مكتبة Excel غير متاحة.', 'error'); return; }
  const headers = IMPORT_COLUMNS.map(c=>c.label);
  const ws = XLSX.utils.aoa_to_sheet([headers, ['2044001','عبدالله محمد',26,9,13,8,24,17,'د. سلطان العتيبي','كيمياء عامة','101']]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الطلبة');
  wb.Workbook = { Views:[{RTL:true}] };
  XLSX.writeFile(wb, 'قالب_استيراد_الطلبة.xlsx');
}

function wirePageEvents(){
  document.querySelectorAll('#content [data-nav]').forEach(el=> el.onclick = ()=> go(el.getAttribute('data-nav')));
  document.querySelectorAll('[data-student]').forEach(el=> el.onclick = ()=> openStudentDetail(el.getAttribute('data-student')));

  const importBtn = document.getElementById('importExcelBtn');
  const fileInput = document.getElementById('excelFileInput');
  if(importBtn && fileInput){
    importBtn.onclick = (e)=>{ e.preventDefault(); fileInput.click(); };
    fileInput.onchange = (e)=>{ const file = e.target.files[0]; if(file) startExcelImport(file); fileInput.value = ''; };
  }
  const tplBtn = document.getElementById('downloadTemplateBtn'); if(tplBtn) tplBtn.onclick=(e)=>{ e.preventDefault(); downloadStudentsTemplate(); };
  const exportBtn = document.getElementById('exportStudentsBtn'); if(exportBtn) exportBtn.onclick=(e)=>{ e.preventDefault(); exportStudentsExcel(scopedStudents()); };
  const stuSearch=document.getElementById('stuSearch'); if(stuSearch) stuSearch.oninput=()=>{ S.studentFilters.q=stuSearch.value; S.studentPage=1; renderRoute(); };
}

const SYNC = {
  url:'',
  on(){ return false; },
  schedulePush(){},
  async pull(){ return false; }
};

DB.load();
render();
</script>

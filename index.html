<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title> Miyar </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F0F4F8;
  --surface:#FFFFFF;
  --surface-2:#E2E8F0;
  --border:#CBD5E1;
  --text:#0F172A;
  --text-muted:#475569;
  --primary-900:#001F3F;
  --primary-800:#003366;
  --primary-700:#004080;
  --primary-600:#0055A5;
  --primary-500:#0066CC;
  --primary-100:#E6F0FA;
  --gold-700:#003366;
  --gold-500:#0055A5;
  --gold-100:#E6F0FA;
  --green:#10B981;      --green-bg:#D1FAE5;
  --amber:#F59E0B;      --amber-bg:#FEF3C7;
  --red:#EF4444;        --red-bg:#FEE2E2;
  --gray:#64748B;       --gray-bg:#F1F5F9;
  --shadow:0 1px 2px rgba(0,31,63,.06), 0 6px 20px -6px rgba(0,31,63,.10);
  --radius:14px;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B132B; --surface:#1C2541; --surface-2:#24305E; --border:#3A506B;
    --text:#F0F4F8; --text-muted:#94A3B8;
    --primary-100:#1D3557; --gold-100:#1D3557;
    --green-bg:#132A13; --amber-bg:#332708; --red-bg:#3A1B17; --gray-bg:#1E293B;
  }
}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Tajawal', 'Cairo', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.font-head{font-family:'Cairo','Tajawal',system-ui,sans-serif;}
::selection{background:var(--primary-100);}
a{color:inherit;}
button{font-family:inherit;}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

/* ---------- layout ---------- */
#app{min-height:100%;}
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:264px; flex:0 0 264px; background:linear-gradient(180deg,var(--primary-900),var(--primary-800));
  color:#E2E8F0; position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto;
  padding:18px 14px; display:flex; flex-direction:column; gap:6px; z-index:40;
}
.sidebar-brand{display:flex; align-items:center; gap:12px; padding:8px 8px 18px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:10px;}
.sidebar-brand .mark{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--gold-500),#3399FF);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;box-shadow:0 4px 14px rgba(0,85,165,.35); color:#fff;}
.sidebar-brand .txt{line-height:1.25;}
.sidebar-brand .txt b{font-family:'Cairo';font-weight:800;font-size:15px;display:block;}
.sidebar-brand .txt span{font-size:11.5px;color:#B0C4DE;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; cursor:pointer;
  color:#CBD5E1; font-size:14px; font-weight:600; transition:background .15s,color .15s; user-select:none;
}
.nav-item svg{width:18px;height:18px;flex:0 0 auto;opacity:.9;}
.nav-item:hover{background:rgba(255,255,255,.08); color:#fff;}
.nav-item.active{background:rgba(255,255,255,.14); color:#fff; box-shadow:inset 3px 0 0 #3399FF;}
.nav-sec{font-size:11px; color:#94A3B8; font-weight:700; margin:14px 8px 4px; letter-spacing:.02em;}
.sidebar-foot{margin-top:auto; padding:10px 8px; font-size:11px; color:#94A3B8; border-top:1px solid rgba(255,255,255,.1);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border); z-index:30; display:flex; align-items:center; gap:12px;
  padding-inline:18px; padding-bottom:12px;
}
.topbar .grow{flex:1;}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);transition:.15s;}
.icon-btn:hover{background:var(--surface-2); color:var(--text);}
.icon-btn svg{width:17px;height:17px;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;min-width:220px;max-width:340px;}
.search-box input{border:none;background:transparent;outline:none;font-size:13.5px;color:var(--text);width:100%;}
.search-box svg{width:16px;height:16px;color:var(--text-muted);flex:0 0 auto;}
.avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary-600),var(--primary-900));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;font-family:'Cairo';}
.mobile-menu-btn{display:none;}
.content{padding:20px; flex:1;}
.breadcrumb{font-size:12.5px;color:var(--text-muted);margin-bottom:6px;display:flex;gap:6px;align-items:center;}
.page-title{font-family:'Cairo';font-weight:800;font-size:22px;margin:0 0 3px;}
.page-desc{color:var(--text-muted);font-size:13.5px;margin:0 0 18px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;}

/* ---------- cards / kpi ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.grid{display:grid;gap:14px;}
.g-4{grid-template-columns:repeat(4,1fr);}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.g-4{grid-template-columns:repeat(2,1fr);} .g-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.g-4,.g-3,.g-2{grid-template-columns:1fr;}}

.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;}
.kpi .top{display:flex;align-items:center;justify-content:space-between;}
.kpi .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.kpi .ic svg{width:19px;height:19px;}
.kpi .val{font-family:'Cairo';font-weight:800;font-size:26px;line-height:1;}
.kpi .lbl{font-size:12.5px;color:var(--text-muted);font-weight:600;}
.kpi .delta{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px;width:fit-content;padding:2px 8px;border-radius:99px;}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;}
.badge .dot{width:7px;height:7px;border-radius:99px;}
.b-green{background:var(--green-bg);color:var(--green);}
.b-amber{background:var(--amber-bg);color:var(--amber);}
.b-red{background:var(--red-bg);color:var(--red);}
.b-gray{background:var(--gray-bg);color:var(--gray);}
.b-green .dot{background:var(--green);} .b-amber .dot{background:var(--amber);} .b-red .dot{background:var(--red);} .b-gray .dot{background:var(--gray);}

.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
.progress > div{height:100%;border-radius:99px;transition:width .4s ease;}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid transparent;transition:transform .08s ease, background .15s, box-shadow .15s;white-space:nowrap;}
.btn svg{width:16px;height:16px;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-primary{background:linear-gradient(135deg,var(--primary-600),var(--primary-800));color:#fff;box-shadow:0 6px 16px -6px rgba(0,85,165,.55);}
.btn-primary:hover{box-shadow:0 8px 20px -6px rgba(0,85,165,.65);}
.btn-gold{background:linear-gradient(135deg,var(--gold-500),var(--gold-700));color:#fff;box-shadow:0 6px 16px -6px rgba(0,51,102,.5);}
.btn-outline{background:var(--surface);border-color:var(--border);color:var(--text);}
.btn-outline:hover{background:var(--surface-2);}
.btn-ghost{background:transparent;color:var(--text-muted);}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);}
.btn-danger{background:var(--red-bg);color:var(--red);}
.btn-danger:hover{background:#f4d4cf;}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:8px;}
.btn-loading{position:relative;color:transparent !important;pointer-events:none;}
.btn-loading::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;animation:spin .7s linear infinite;}
.btn-outline.btn-loading::after{border-color:rgba(0,0,0,.2);border-top-color:var(--text);}
@keyframes spin{to{transform:rotate(360deg);}}

.iconbtn-sm{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);}
.iconbtn-sm:hover{background:var(--surface-2);color:var(--text);}
.iconbtn-sm svg{width:14.5px;height:14.5px;}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{position:sticky;top:0;background:var(--surface-2);text-align:right;padding:11px 14px;font-weight:700;color:var(--text-muted);font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:hover{background:var(--surface-2);}
tbody tr{cursor:pointer;}
.table-name{font-weight:700;}
.table-sub{color:var(--text-muted);font-size:12px;}

/* ---------- forms ---------- */
label{font-size:12.5px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:6px;}
.field{margin-bottom:14px;}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 12px;font-size:13.5px;outline:none;transition:border-color .15s, box-shadow .15s;font-family:inherit;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary-500);box-shadow:0 0 0 3px var(--primary-100);}
textarea{resize:vertical;min-height:76px;}
.input-icon-wrap{position:relative;}
.input-icon-wrap input{padding-left:40px;}
.input-icon-wrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);cursor:pointer;}
.input-icon-wrap .ic svg{width:17px;height:17px;}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;}
@media(max-width:880px){.login-wrap{grid-template-columns:1fr;}}
.login-hero{background:radial-gradient(1200px 700px at 20% -10%, #004080 0%, var(--primary-800) 45%, var(--primary-900) 100%);color:#fff;padding:52px 46px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
.login-hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,.08) 1px, transparent 0),radial-gradient(2px 2px at 90px 120px, rgba(255,255,255,.06) 1px, transparent 0),radial-gradient(2px 2px at 160px 60px, rgba(255,255,255,.07) 1px, transparent 0);background-size:200px 200px;opacity:.6;}
@media(max-width:880px){.login-hero{padding:36px 26px;}}
.login-form-side{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--bg);}
.login-card{width:100%;max-width:380px;}
.demo-box{background:var(--gold-100);border:1px dashed var(--gold-500);border-radius:12px;padding:12px 14px;font-size:12px;color:#003366;margin-top:16px;line-height:1.9;}

/* ---------- misc ---------- */
.divider{height:1px;background:var(--border);margin:16px 0;}
.tag-pill{padding:3px 10px;background:var(--surface-2);border-radius:99px;font-size:11.5px;font-weight:700;color:var(--text-muted);}
.empty{text-align:center;padding:50px 20px;color:var(--text-muted);}
.empty svg{width:44px;height:44px;margin-bottom:10px;opacity:.5;}
.stepper-track{display:flex;align-items:center;margin-bottom:22px;}
.step-dot{width:30px;height:30px;border-radius:50%;background:var(--surface-2);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;font-family:'Cairo';border:2px solid var(--border);flex:0 0 auto;transition:.2s;}
.step-dot.done{background:var(--primary-600);border-color:var(--primary-600);color:#fff;}
.step-dot.current{border-color:var(--primary-600);color:var(--primary-700);background:var(--primary-100);}
.step-line{flex:1;height:2px;background:var(--border);margin:0 4px;}
.step-line.done{background:var(--primary-600);}
.step-label{font-size:10.5px;color:var(--text-muted);text-align:center;margin-top:6px;width:64px;}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,31,63,.45);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.modal{background:var(--surface);border-radius:16px;box-shadow:0 20px 60px -12px rgba(0,0,0,.35);width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;animation:pop .18s ease;}
.modal.modal-lg{max-width:760px;}
@keyframes pop{from{transform:scale(.96);opacity:0;} to{transform:scale(1);opacity:1;}}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-body{padding:20px;overflow-y:auto;}
.modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;padding-bottom:env(safe-area-inset-bottom,0px);width:min(92vw,380px);}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px -8px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;animation:slideUp .2s ease;}
@keyframes slideUp{from{transform:translateY(10px);opacity:0;} to{transform:translateY(0);opacity:1;}}
.toast .ic{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.toast .ic svg{width:13px;height:13px;}

.mobile-scrim{display:none;}
@media(max-width:900px){
  .sidebar{position:fixed; inset-inline-start:0; top:0; transform:translateX(105%); transition:transform .22s ease; box-shadow:0 0 40px rgba(0,0,0,.3);}
  [dir=rtl] .sidebar{transform:translateX(105%);}
  .sidebar.open{transform:translateX(0);}
  .mobile-menu-btn{display:flex;}
  .search-box{display:none;}
  .mobile-scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39;}
  .content{padding:14px;}
  table thead{display:none;}
  .responsive-cards tbody tr{display:block;border-bottom:8px solid var(--bg);}
  .responsive-cards tbody td{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);}
  .responsive-cards tbody td::before{content:attr(data-label);font-weight:700;color:var(--text-muted);font-size:12px;}
}
.hide-mobile{display:inline-flex;}
@media(max-width:640px){.hide-mobile{display:none;}}

/* ---------- scheme editor / reports (معايير التقييم) ---------- */
.crit-card{padding:18px;}
.crit-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.crit-desc{background:var(--primary-100);color:var(--text);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.9;margin-top:4px;}
.crit-preview{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:13px;}
.crit-preview input{width:110px;}
.band-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:12.5px;}
.band-row input{width:84px;}
.crit-err{color:var(--red);font-size:12px;font-weight:700;margin-top:4px;}
.mono{font-family:ui-monospace,Consolas,monospace;direction:ltr;text-align:left;}
.scheme-table td,.scheme-table th{vertical-align:top;}

@media print{
  .sidebar,.topbar,.no-print,.page-head,.breadcrumb,.mobile-scrim,#toastWrap{display:none !important;}
  .shell,.main{display:block !important;}
  .content{padding:0 !important;}
  body{background:#fff;}
  .card{box-shadow:none !important;}
  body:has(#studentModal) .shell{display:none !important;}
  #studentModal{position:static !important;background:none !important;padding:0 !important;}
  #studentModal .modal{box-shadow:none !important;max-height:none !important;max-width:100% !important;}
  #studentModal .modal-foot,#studentModal .icon-btn{display:none !important;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toastWrap" class="toast-wrap"></div>

<script>
/* =======================================================================
    نظام معيار (Miyar) — تقييم ومتابعة الأداء الأكاديمي
    جامعة الملك سعود — السنة الأولى المشتركة — قسم العلوم الأساسية
    ======================================================================= */

const ICON = {

  users:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  book:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  grad:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>',
  chart:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>',

/* ---------------- Seeded PRNG for stable demo data ---------------- */
function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(20260919);
function ri(a,b){return Math.floor(rnd()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(rnd()*arr.length)];}
function uid(p){return p+'_'+Math.random().toString(36).slice(2,9);}

/* ================================ Evaluation scheme (dynamic criteria) ================================ */
/* كل شعبة لها «مقياس تقييم» يضبطه مدرس المادة: لكل معيار وزن + حد أعظم للدرجة الخام + آلية حساب. */
const CRITERIA = [
  {key:'attendance', label:'الحضور',          raw:'عدد ساعات الحضور',    unit:'ساعة',  maxLabel:'إجمالي ساعات المقرر'},
  {key:'activities', label:'الأنشطة',         raw:'درجة الأنشطة',        unit:'درجة', maxLabel:'الدرجة العظمى للأنشطة'},
  {key:'exercises',  label:'التمارين',        raw:'درجة التمارين',       unit:'درجة', maxLabel:'الدرجة العظمى للتمارين'},
  {key:'homework',   label:'الواجب الورقي',   raw:'درجة الواجب الورقي',  unit:'درجة', maxLabel:'الدرجة العظمى للواجب الورقي'},
  {key:'midterm',    label:'اختبار المنتصف',  raw:'درجة المنتصف',        unit:'درجة', maxLabel:'الدرجة العظمى لاختبار المنتصف'},
  {key:'evaluation', label:'تقييم المدرس',    raw:'تقييم المدرس',        unit:'درجة', maxLabel:'الدرجة العظمى لتقييم المدرس'},
];
const METHODS = {
  linear:{ label:'نسبي مباشر' },
  cap:   { label:'نسبي مع حدّ إتقان' },
  bands: { label:'شرائح (مستويات)' },
  deduct:{ label:'خصم من الدرجة الكاملة' },
  custom:{ label:'معادلة مخصصة' },
};
function n0(v){ const n = parseFloat(v); return Number.isFinite(n) ? n : 0; }
function fmtN(n){ const v = Math.round(n0(n)*10)/10; return String(v); }
function escHtml(s){ return String(s ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function cloneJSON(o){ return JSON.parse(JSON.stringify(o)); }

function defaultCriterion(weight, max){
  return { weight, max, method:'linear', capPct:80, perUnit: max>0 ? Math.round(weight/max*100)/100 : 1, formula:'w * p',
           bands:[{min:90,pct:100},{min:75,pct:85},{min:60,pct:70},{min:50,pct:55},{min:0,pct:0}] };
}
const DEFAULT_SCHEME = { criteria:{
  attendance: defaultCriterion(15,30),
  activities: defaultCriterion(10,10),
  exercises:  defaultCriterion(15,15),
  homework:   defaultCriterion(10,10),
  midterm:    defaultCriterion(30,30),
  evaluation: defaultCriterion(20,20),
}};

/* ---- محرّك المعادلات المخصصة (آمن: قائمة بيضاء للرموز والدوال فقط) ---- */
const FORMULA_FUNCS = { min:Math.min, max:Math.max, sqrt:Math.sqrt, abs:Math.abs, round:Math.round, floor:Math.floor, ceil:Math.ceil, pow:Math.pow, iff:(c,a,b)=>(c?a:b) };
const _formulaCache = new Map();
function compileFormula(src){
  let s = String(src ?? '').trim();
  if(!s) throw new Error('المعادلة فارغة');
  s = s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/،/g,',').replace(/×/g,'*').replace(/÷/g,'/').replace(/\bif\s*\(/g,'iff(');
  if(s.length > 200) throw new Error('المعادلة طويلة جدًا');
  if(_formulaCache.has(s)) return _formulaCache.get(s);
  const allowed = new Set(['x','m','w','p', ...Object.keys(FORMULA_FUNCS)]);
  for(const id of (s.match(/[A-Za-z_]\w*/g) || [])){ if(!allowed.has(id)) throw new Error('رمز غير مسموح في المعادلة: '+id); }
  if(/[^0-9A-Za-z_+\-*/%().,<>=!&|?:\s]/.test(s)) throw new Error('المعادلة تحتوي على رموز غير مسموحة');
  if(/[^0-9]\.|\.[^0-9]/.test(s)) throw new Error('صيغة الأرقام العشرية غير صحيحة');
  if(s.replace(/===|!==|==|!=|<=|>=/g,'').includes('=')) throw new Error('علامة = غير مسموحة (استخدم == للمقارنة)');
  let fn;
  try{ fn = new Function('x','m','w','p','F','"use strict"; const {min,max,sqrt,abs,round,floor,ceil,pow,iff}=F; return ('+s+');'); }
  catch(e){ throw new Error('صيغة المعادلة غير صحيحة'); }
  _formulaCache.set(s, fn);
  return fn;
}
function runFormula(src, vars){
  try{
    const fn = compileFormula(src);
    const v = fn(vars.x, vars.m, vars.w, vars.p, FORMULA_FUNCS);
    if(typeof v !== 'number' || !Number.isFinite(v)) return {error:'ناتج المعادلة ليس رقمًا صالحًا'};
    return {value:v};
  }catch(e){ return {error: e.message || 'خطأ في المعادلة'}; }
}

/* ---- حساب الدرجة المكتسبة لمعيار واحد وفق الآلية المختارة ---- */
function evalCriterion(c, raw){
  const w = Math.max(0, n0(c.weight)), m = n0(c.max);
  const x = Math.max(0, n0(raw));
  const p = m > 0 ? x/m : 0;
  let earned = 0, err = null;
  switch(c.method){
    case 'cap': {
      const cp = Math.min(100, Math.max(1, n0(c.capPct) || 100))/100;
      earned = Math.min(p/cp, 1) * w; break;
    }
    case 'bands': {
      const pp = p*100;
      const bs = (Array.isArray(c.bands)? c.bands : []).slice().sort((a,b)=>n0(b.min)-n0(a.min));
      const hit = bs.find(b=> pp >= n0(b.min) - 1e-9);
      earned = hit ? (n0(hit.pct)/100) * w : 0; break;
    }
    case 'deduct': {
      earned = w - Math.max(0, m - x) * n0(c.perUnit); break;
    }
    case 'custom': {
      const r = runFormula(c.formula, {x, m, w, p});
      if(r.error){ err = r.error; earned = 0; } else earned = r.value;
      break;
    }
    default: earned = Math.min(p, 1) * w;
  }
  if(!Number.isFinite(earned)) earned = 0;
  earned = Math.round(Math.max(0, Math.min(w, earned))*100)/100;
  return { earned, weight:w, pct: w>0 ? earned/w*100 : 0, p, err };
}

/* ---- وصف الآلية المختارة بلغة مقروءة (يُستخدم في صفحة المعايير والتقارير) ---- */
function describeCriterion(c){
  const w = fmtN(c.weight), m = fmtN(c.max);
  const name = (METHODS[c.method] || METHODS.linear).label;
  let lines = [];
  switch(c.method){
    case 'cap':
      lines = [`درجة كاملة (${w}) عند بلوغ ${fmtN(c.capPct)}% من ${m}، وتناسبيًا قبل ذلك: (الدرجة ÷ (${m} × ${fmtN(c.capPct)}%)) × ${w}`]; break;
    case 'bands': {
      const bs = (Array.isArray(c.bands)? c.bands : []).slice().sort((a,b)=>n0(b.min)-n0(a.min));
      lines = bs.map(b=>`إذا بلغت النسبة ≥ ${fmtN(b.min)}% من ${m} ← ${fmtN(b.pct)}% من الوزن (${fmtN(n0(c.weight)*n0(b.pct)/100)})`);
      if(!lines.length) lines = ['لا توجد شرائح معرّفة']; break;
    }
    case 'deduct':
      lines = [`${w} − ((${m} − الدرجة) × ${fmtN(c.perUnit)})، وبحدّ أدنى صفر`]; break;
    case 'custom':
      lines = [`المعادلة: ${c.formula}  (x = الدرجة الخام، m = الحد الأعظم ${m}، w = الوزن ${w}، p = x ÷ m)`]; break;
    default:
      lines = [`(الدرجة ÷ ${m}) × ${w}`];
  }
  return { name, lines, html: lines.map(escHtml).join('<br>'), plain: lines.join('؛ ') };
}

/* ---- قراءة مقياس شعبة (مع تطبيع وكاش) ---- */
const _schemeCache = new WeakMap();
let _defaultSchemeNorm = null;
function normalizeScheme(sc){
  const out = cloneJSON(DEFAULT_SCHEME);
  if(!sc || !sc.criteria) return out;
  CRITERIA.forEach(cr=>{
    const src = sc.criteria[cr.key]; if(!src) return;
    const d = out.criteria[cr.key];
    ['weight','max','capPct','perUnit'].forEach(f=>{ if(src[f] !== undefined && src[f] !== '' && Number.isFinite(parseFloat(src[f]))) d[f] = parseFloat(src[f]); });
    if(METHODS[src.method]) d.method = src.method;
    if(typeof src.formula === 'string' && src.formula.trim()) d.formula = src.formula;
    if(src.bands){
      const arr = Array.isArray(src.bands) ? src.bands : Object.values(src.bands);
      const clean = arr.filter(b=>b && Number.isFinite(parseFloat(b.min)) && Number.isFinite(parseFloat(b.pct))).map(b=>({min:parseFloat(b.min), pct:parseFloat(b.pct)}));
      if(clean.length) d.bands = clean;
    }
  });
  out.updatedAt = sc.updatedAt; out.updatedBy = sc.updatedBy;
  return out;
}
function getScheme(sectionId){
  const raw = DB.data && DB.data.schemes ? DB.data.schemes[sectionId] : null;
  if(!raw){ if(!_defaultSchemeNorm) _defaultSchemeNorm = normalizeScheme(null); return _defaultSchemeNorm; }
  let n = _schemeCache.get(raw);
  if(!n){ n = normalizeScheme(raw); _schemeCache.set(raw, n); }
  return n;
}
function saveScheme(sectionId, scheme){
  const copy = cloneJSON(scheme);
  copy.updatedAt = new Date().toISOString();
  copy.updatedBy = S.user ? S.user.name : '';
  DB.data.schemes = DB.data.schemes || {};
  DB.data.schemes[sectionId] = copy;
  DB.save();
}

/* ---- ترحيل بيانات الهيكل القديم (إن وُجدت) إلى الهيكل الجديد ---- */
function ensureScores(s){
  if(!s || s.scores) return s;
  const a=s.attendance||{}, ac=s.activities||{}, ex=s.exercises||{}, mi=s.midterm||{}, ev=s.evaluation||{};
  const D = DEFAULT_SCHEME.criteria;
  const pc = (p,k)=> Math.round(n0(p)/100*D[k].max*2)/2;
  s.scores = {
    attendance: a.total ? Math.round(n0(a.attended)/a.total*D.attendance.max) : 0,
    activities: pc((n0(ac.activity)+n0(ac.assignment)+n0(ac.participation))/3,'activities'),
    exercises:  pc(ex.pct,'exercises'),
    homework:   pc(ac.assignment,'homework'),
    midterm:    mi.max ? Math.round(n0(mi.score)/mi.max*D.midterm.max*2)/2 : 0,
    evaluation: pc((n0(ev.score)+n0(ev.participation)+n0(ev.engagement))/3,'evaluation'),
  };
  if(s.comment === undefined) s.comment = ev.comment || '';
  delete s.attendance; delete s.activities; delete s.exercises; delete s.midterm; delete s.evaluation; delete s.history;
  return s;
}

function weightedPick(pairs){ const r=rnd(); let acc=0; for(const [k,w] of pairs){acc+=w; if(r<=acc) return k;} return pairs[pairs.length-1][0]; }
function daysAgoISO(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
/* ================================ Classification engine ================================ */
/* الدرجة الكلية = مجموع الدرجات المكتسبة ÷ مجموع الأوزان × 100، وتُحسب كل درجة وفق آلية المعيار التي اختارها المدرس. */
function classify(student, settings){
  settings = settings || DB.data.settings;
  const scheme = getScheme(student.sectionId);
  const raw = student.scores || {};
  const cA = scheme.criteria.attendance;
  const attRate = cA.max > 0 ? Math.max(0, Math.min(100, n0(raw.attendance)/cA.max*100)) : 100;
  const parts = {}; let earned = 0, totalW = 0;
  CRITERIA.forEach(cr=>{
    const r = evalCriterion(scheme.criteria[cr.key], raw[cr.key]);
    parts[cr.key] = r; earned += r.earned; totalW += r.weight;
  });
  const score = totalW > 0 ? earned/totalW*100 : 0;
  const base = { score: Math.round(score), attRate: Math.round(attRate), parts, earned, totalW, scheme };
  if(attRate <= settings.grayAttendanceMax) return Object.assign({status:'gray'}, base, {score: Math.round(score)});
  const status = score >= settings.greenMin ? 'green' : (score >= settings.yellowMin ? 'yellow' : 'red');
  return Object.assign({status}, base);
}
const STATUS_LABEL = {green:'أخضر · مستقر', yellow:'أصفر · يحتاج متابعة', red:'أحمر · تدخل عاجل', gray:'رمادي · غائب/منقطع'};
const STATUS_SHORT = {green:'أخضر', yellow:'أصفر', red:'أحمر', gray:'رمادي'};
function badgeHTML(status, withLabel){
  const cls = {green:'b-green',yellow:'b-amber',red:'b-red',gray:'b-gray'}[status];
  return `<span class="badge ${cls}"><span class="dot"></span>${withLabel? STATUS_LABEL[status] : STATUS_SHORT[status]}</span>`;
}

function computeStats(students){
  const c={green:0,yellow:0,red:0,gray:0};
  let attSum=0;
  students.forEach(s=>{ const r=classify(s); c[r.status]++; attSum += r.attRate; });
  const total = students.length||1;
  return {
    total: students.length, ...c,
    greenPct: Math.round(c.green/total*100), yellowPct: Math.round(c.yellow/total*100),
    redPct: Math.round(c.red/total*100), grayPct: Math.round(c.gray/total*100),
    avgAttendance: students.length? Math.round(attSum/students.length):0
  };
}

/* ================================ Toasts & Confirm ================================ */
function toast(msg, type='success'){
  const wrap = document.getElementById('toastWrap');
  const icon = type==='success'?ICON.check: type==='error'?ICON.x : type==='warn'?ICON.alert:ICON.info;
  const color = type==='success'?'var(--green)':type==='error'?'var(--red)':type==='warn'?'var(--amber)':'var(--primary-600)';
  const bg = type==='success'?'var(--green-bg)':type==='error'?'var(--red-bg)':type==='warn'?'var(--amber-bg)':'var(--primary-100)';
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `<span class="ic" style="background:${bg};color:${color}">${icon}</span><span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s, transform .25s'; el.style.opacity='0'; el.style.transform='translateY(8px)'; setTimeout(()=>el.remove(),250); }, 3200);
}
function confirmDialog(opts){
  const {title, message, confirmText='تأكيد', danger=true, onConfirm} = opts;
  const ov = document.createElement('div'); ov.className='overlay';
  ov.innerHTML = `
    <div class="modal" style="max-width:420px;">
      <div class="modal-body" style="text-align:center;padding:28px 22px 8px;">
        <div style="width:52px;height:52px;border-radius:50%;background:${danger?'var(--red-bg)':'var(--amber-bg)'};color:${danger?'var(--red)':'var(--amber)'};display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">${ICON.alert}</div>
        <h3 style="margin:0 0 8px;font-family:Cairo;font-size:16.5px;">${title}</h3>
        <p style="color:var(--text-muted);font-size:13.5px;margin:0 0 4px;line-height:1.7;">${message}</p>
      </div>
      <div class="modal-foot" style="justify-content:center;">
        <button class="btn btn-outline" id="cdCancel">إلغاء</button>
        <button class="btn ${danger?'btn-danger':'btn-primary'}" id="cdOk">${confirmText}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#cdCancel').onclick=()=>ov.remove();
  ov.onclick=(e)=>{ if(e.target===ov) ov.remove(); };
  ov.querySelector('#cdOk').onclick=()=>{ ov.remove(); onConfirm && onConfirm(); };
}

  else if(S.route==='alerts') html += alertsView();
  else if(S.route==='courses') html += coursesView();
  else if(S.route==='sections') html += sectionsView();
  else if(S.route==='students') html += studentsView();
  else if(S.route==='comparison') html += comparisonView();
  else if(S.route==='reports') html += reportsView();
  else if(S.route==='users') html += usersView();
  else if(S.route==='audit') html += auditView();
  else if(S.route==='settings') html += settingsView();
  else if(S.route==='scheme') html += schemeView();
  c.innerHTML = html;
  const pageActions = document.getElementById('pageActions');
  if(pageActions) pageActions.innerHTML = pageActionsForRoute();
  afterRouteRender();
}

/* ================================ KPI card helper ================================ */
function kpiCard(icon,label,value,tone,delta){
  const tones = {primary:['var(--primary-100)','var(--primary-700)'],gold:['var(--gold-100)','var(--gold-700)'],green:['var(--green-bg)','var(--green)'],amber:['var(--amber-bg)','var(--amber)'],red:['var(--red-bg)','var(--red)'],gray:['var(--gray-bg)','var(--gray)']};
  const [bg,fg] = tones[tone]||tones.primary;
  return `<div class="card kpi">
    <div class="top"><div class="ic" style="background:${bg};color:${fg}">${icon}</div>${delta?`<span class="delta" style="background:${bg};color:${fg}">${delta}</span>`:''}</div>
    <div class="val">${value}</div><div class="lbl">${label}</div>
  </div>`;
}

function legendRow(tone,label,count,total){
  const colors={green:'var(--green)',amber:'var(--amber)',red:'var(--red)',gray:'var(--gray)'};

  return `<div>
    <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><span style="display:flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:99px;background:${colors[tone]};display:inline-block;"></span>${label}</span><b>${count} (${pct}%)</b></span></div>
    <div class="progress"><div style="width:${pct}%;background:${colors[tone]};"></div></div>
  </div>`;
}
function instructorKpiRow(i){
  const c = courseOf(i.courseId), sec = sectionOf(i.sectionId);
  const overall = Math.round((i.kpis.lectures+i.kpis.plan+i.kpis.officeHours+i.kpis.grading+i.kpis.submission)/5);
  const tone = overall>=90?'var(--green)':overall>=75?'var(--amber)':'var(--red)';
  return `<div style="padding:10px 0;border-bottom:1px solid var(--border);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <div><div style="font-weight:700;font-size:13px;">${i.name}</div><div class="table-sub">${c?c.name:'مقرر محذوف'} — شعبة ${sec?sec.number:'--'}</div></div>
      <div style="font-family:Cairo;font-weight:800;color:${tone};">${overall}%</div>
    </div>
    <div class="progress"><div style="width:${overall}%;background:${tone};"></div></div>
  </div>`;
}
function alertsList(students, limit){
  const withStatus = students.map(s=>({s, r:classify(s)})).filter(x=>x.r.status==='red'||x.r.status==='gray');
  withStatus.sort((a,b)=> (a.r.status==='gray'?0:1) - (b.r.status==='gray'?0:1) || a.r.score-b.r.score);
  const list = withStatus.slice(0,limit||withStatus.length);
  if(!list.length) return `<div class="empty">${ICON.check}<div>لا توجد تنبيهات عاجلة حاليًا</div></div>`;
  return list.map(({s,r})=>{
    const c = courseOf(s.courseId), sec = sectionOf(s.sectionId);
    return `<div class="alert-row" data-student="${s.id}" style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer;">
      <div style="display:flex;align-items:center;gap:10px;min-width:0;">

      </div>
      ${badgeHTML(r.status)}
    </div>`;
  }).join('');
}

  }).join('<div style="height:14px;"></div>');
  return rows;
}

function critCell(cr, s, r){
  const p = r.parts[cr.key], c = r.scheme.criteria[cr.key];
  return `<div style="font-weight:700;">${fmtN(p.earned)}<span class="table-sub" style="font-weight:500;"> / ${fmtN(p.weight)}</span></div>
          <div class="table-sub">خام ${fmtN((s.scores||{})[cr.key])}/${fmtN(c.max)}</div>`;
}
function studentsView(){
  const inst = currentInstructor();
  const base = scopedStudents();
  const f = S.studentFilters;
  const rows = base.map(s=>({s, r:classify(s)}));
  let list = rows.filter(({s,r})=>{
    if(f.q && !(s.name.includes(f.q)||String(s.studentId).includes(f.q))) return false;
    if(f.status!=='all' && r.status!==f.status) return false;
    if(!inst && f.sectionId!=='all' && s.sectionId!==f.sectionId) return false;
    return true;
  });
  list.sort((a,b)=>{
    if(f.sort==='name') return a.s.name.localeCompare(b.s.name,'ar');
    if(f.sort==='status'){ const order={red:0,gray:1,yellow:2,green:3}; return order[a.r.status]-order[b.r.status]; }
    if(f.sort==='attendance') return b.r.attRate - a.r.attRate;
    if(f.sort==='score') return b.r.score - a.r.score;
    return 0;
  });
  const pageSize=10; const totalPages=Math.max(1,Math.ceil(list.length/pageSize));
  S.studentPage = Math.min(S.studentPage,totalPages);
  const pageList = list.slice((S.studentPage-1)*pageSize, S.studentPage*pageSize);

  const sectionOptions = inst? '' : `<select id="filterSection"><option value="all">جميع الشعب</option>${DB.data.sections.map(s=>`<option value="${s.id}" ${f.sectionId===s.id?'selected':''}>${(courseOf(s.courseId)||{}).name||''} — شعبة ${s.number}</option>`).join('')}</select>`;

  return `
  <div class="card" style="padding:14px 16px;margin-bottom:14px;">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      <div class="search-box" style="min-width:220px;"><span>${ICON.search}</span><input id="stuSearch" placeholder="ابحث بالاسم أو الرقم الجامعي" value="${escHtml(f.q)}"></div>
      <select id="filterStatus" style="width:auto;min-width:160px;">
        <option value="all" ${f.status==='all'?'selected':''}>كل الحالات</option>
        <option value="green" ${f.status==='green'?'selected':''}>🟢 أخضر</option>
        <option value="yellow" ${f.status==='yellow'?'selected':''}>🟡 أصفر</option>
        <option value="red" ${f.status==='red'?'selected':''}>🔴 أحمر</option>
        <option value="gray" ${f.status==='gray'?'selected':''}>⚪ رمادي — غائب</option>
      </select>
      ${inst?'':`<div style="width:auto;min-width:200px;">${sectionOptions}</div>`}
      <select id="filterSort" style="width:auto;min-width:150px;">
        <option value="name" ${f.sort==='name'?'selected':''}>ترتيب: الاسم</option>
        <option value="status" ${f.sort==='status'?'selected':''}>ترتيب: الحالة</option>
        <option value="attendance" ${f.sort==='attendance'?'selected':''}>ترتيب: الحضور</option>
        <option value="score" ${f.sort==='score'?'selected':''}>ترتيب: الدرجة الكلية</option>
      </select>
      <div class="tag-pill" style="margin-inline-start:auto;">${list.length} نتيجة</div>
    </div>
  </div>
  <div class="card">
    <div class="scrollx"><table class="responsive-cards">
      <thead><tr><th>الرقم الجامعي</th><th>اسم الطالب</th>${CRITERIA.map(cr=>`<th>${cr.label}</th>`).join('')}<th>المجموع</th><th>الحالة</th><th></th></tr></thead>
      <tbody>
      ${pageList.length? pageList.map(({s,r})=>{
        const crs = courseOf(s.courseId);
        const sec = sectionOf(s.sectionId);
        return `<tr data-student="${s.id}">
          <td data-label="الرقم الجامعي">${escHtml(s.studentId)}</td>
          <td data-label="الاسم"><div class="table-name">${escHtml(s.name)}</div><div class="table-sub">${crs?crs.name:''} — ${sec?sec.number:''}</div></td>
          ${CRITERIA.map(cr=>`<td data-label="${cr.label}">${critCell(cr,s,r)}</td>`).join('')}
          <td data-label="المجموع"><b>${r.score}%</b></td>
          <td data-label="الحالة">${badgeHTML(r.status)}</td>
          <td data-label=""><div style="display:flex;gap:6px;" onclick="event.stopPropagation()">
            <button class="iconbtn-sm" data-view-student="${s.id}" title="عرض">${ICON.eye}</button>
            <button class="iconbtn-sm" data-edit-student="${s.id}" title="تعديل">${ICON.edit}</button>
            <button class="iconbtn-sm" data-del-student="${s.id}" title="حذف">${ICON.trash}</button>
          </div></td>
        </tr>`;
      }).join('') : `<tr><td colspan="${CRITERIA.length+5}"><div class="empty">${ICON.search}<div>لا توجد نتائج مطابقة — يمكنك استيراد ملف Excel بالزر أعلاه</div></div></td></tr>`}
      </tbody>
    </table></div>
    ${totalPages>1?`<div style="display:flex;justify-content:center;gap:6px;padding:14px;">
      ${Array.from({length:totalPages},(_,i)=>i+1).map(p=>`<button class="iconbtn-sm" style="width:32px;${p===S.studentPage?'background:var(--primary-600);color:#fff;border-color:var(--primary-600);':''}" data-page="${p}">${p}</button>`).join('')}
    </div>`:''}
  </div>`;
}

function statusColor(status,alpha){
  const map={green:'16,185,129',yellow:'245,158,11',red:'239,68,68',gray:'100,116,139'};
  const rgb = map[status]||map.gray;
  return alpha? `rgba(${rgb},${alpha})` : `rgb(${rgb})`;
}

/* ================================ STUDENT FORM ================================ */
function openStudentForm(id){
  const editing = !!id;
  const inst = currentInstructor();
  const s = editing ? DB.data.students.find(x=>x.id===id) : {
    id:null, studentId:'', name:'', courseId: inst? inst.courseId: DB.data.courses[0]?.id||'', sectionId: inst? inst.sectionId: '',
    scores:{attendance:0,activities:0,exercises:0,homework:0,midterm:0,evaluation:0}, comment:'', notes:'', interventions:[]
  };
  const draft = cloneJSON(s);
  ensureScores(draft);
  if(!draft.sectionId){ const first = DB.data.sections.find(x=>x.courseId===draft.courseId); if(first) draft.sectionId = first.id; }

  const ov = document.createElement('div'); ov.className='overlay'; ov.id='studentFormModal';
  ov.innerHTML = `<div class="modal modal-lg">
    <div class="modal-head"><h3 style="margin:0;font-family:Cairo;font-size:16px;">${editing?'تعديل بيانات الطالب':'إضافة طالب جديد'}</h3><button class="icon-btn" id="closeForm">${ICON.x}</button></div>
    <div class="modal-body" id="formBody"></div>
    <div class="modal-foot">
      <button class="btn btn-outline" id="cancelForm">إلغاء</button>
      <button class="btn btn-primary" id="saveStudent">${ICON.check} حفظ البيانات</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  document.getElementById('closeForm').onclick=()=>ov.remove();
  document.getElementById('cancelForm').onclick=()=>ov.remove();
  ov.onclick=(e)=>{ if(e.target===ov) ov.remove(); };

  const val = id=>{ const e=document.getElementById(id); return e? e.value.trim() : ''; };
  const num = id=>{ const e=document.getElementById(id); const n=e?parseFloat(e.value):NaN; return Number.isFinite(n)&&n>=0? n : 0; };

  function readAll(){
    draft.name = val('f_name'); draft.studentId = val('f_sid');
    if(!inst){ const c=document.getElementById('f_course'); if(c) draft.courseId=c.value; const sc=document.getElementById('f_section'); if(sc) draft.sectionId=sc.value; }
    CRITERIA.forEach(cr=>{ const e=document.getElementById('f_sc_'+cr.key); if(e) draft.scores[cr.key]=num('f_sc_'+cr.key); });
    draft.comment = val('f_comment'); draft.notes = val('f_notes');
  }
  function updatePreview(){
    readAll();
    const r = classify({sectionId:draft.sectionId, scores:draft.scores});
    CRITERIA.forEach(cr=>{ const el=document.getElementById('f_pv_'+cr.key); if(el) el.textContent = `المكتسب: ${fmtN(r.parts[cr.key].earned)} من ${fmtN(r.parts[cr.key].weight)}`; });
    const box = document.getElementById('f_summary');
    if(box) box.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;">${badgeHTML(r.status,true)}<b>الدرجة الكلية: ${r.score}% (${fmtN(r.earned)} من ${fmtN(r.totalW)})</b></div>
      <div style="font-size:12.5px;color:var(--text-muted);margin-top:8px;">${escHtml(DB.data.settings.actions[r.status])}</div>`;
  }
  function renderForm(){
    const scheme = getScheme(draft.sectionId);
    const secs = DB.data.sections.filter(x=>x.courseId===draft.courseId);
    document.getElementById('formBody').innerHTML = `
    <div class="grid g-2">
      <div class="field"><label>اسم الطالب</label><input type="text" id="f_name" value="${escHtml(draft.name)}" placeholder="الاسم الكامل"></div>
      <div class="field"><label>الرقم الجامعي</label><input type="text" id="f_sid" value="${escHtml(draft.studentId)}" placeholder="مثال: 2044012"></div>
      <div class="field"><label>المقرر</label>
        <select id="f_course" ${inst?'disabled':''}>${DB.data.courses.map(c=>`<option value="${c.id}" ${draft.courseId===c.id?'selected':''}>${c.name}</option>`).join('')}</select>
      </div>
      <div class="field"><label>الشعبة</label>
        <select id="f_section" ${inst?'disabled':''}>${secs.map(sec=>`<option value="${sec.id}" ${draft.sectionId===sec.id?'selected':''}>شعبة ${sec.number} — ${instructorOf(sec.instructorId)?.name||''}</option>`).join('')}</select>
      </div>
    </div>
    <h4 class="font-head" style="font-size:13.5px;margin:6px 0 4px;">الدرجات الخام</h4>
    <p class="table-sub" style="margin:0 0 10px;">تُحوَّل تلقائيًا إلى درجات مكتسبة وفق مقياس التقييم المعتمد لهذه الشعبة.</p>
    <div class="grid g-3">
      ${CRITERIA.map(cr=>`<div class="field"><label>${cr.raw} (من ${fmtN(scheme.criteria[cr.key].max)})</label>
        <input type="number" min="0" step="0.5" id="f_sc_${cr.key}" value="${draft.scores[cr.key]}">
        <div class="table-sub" id="f_pv_${cr.key}" style="margin-top:4px;"></div></div>`).join('')}
    </div>
    <div class="field"><label>ملاحظة عامة من عضو هيئة التدريس</label><textarea id="f_comment" placeholder="اكتب ملاحظتك هنا...">${escHtml(draft.comment)}</textarea></div>
    <div class="field"><label>ملاحظات أكاديمية إضافية</label><textarea id="f_notes" placeholder="اختياري">${escHtml(draft.notes||'')}</textarea></div>
    <div class="divider"></div>
    <h4 class="font-head" style="font-size:14px;margin:0 0 10px;">النتيجة والتصنيف التلقائي</h4>
    <div class="card" style="padding:14px;background:var(--surface-2);border:none;" id="f_summary"></div>`;
    CRITERIA.forEach(cr=>{ document.getElementById('f_sc_'+cr.key).oninput = updatePreview; });
    if(!inst){
      document.getElementById('f_course').onchange=()=>{ readAll(); const first=DB.data.sections.find(x=>x.courseId===draft.courseId); draft.sectionId = first? first.id : ''; renderForm(); };
      document.getElementById('f_section').onchange=()=>{ readAll(); renderForm(); };
    }
    updatePreview();
  }

  document.getElementById('saveStudent').onclick=()=>{
    readAll();
    if(!draft.name || !draft.studentId){ toast('يرجى تعبئة اسم الطالب والرقم الجامعي','error'); return; }
    if(!draft.sectionId){ toast('يرجى اختيار الشعبة','error'); return; }
    if(DB.data.students.some(x=>x.id!==draft.id && x.sectionId===draft.sectionId && String(x.studentId)===draft.studentId)){
      toast('هذا الرقم الجامعي مسجّل مسبقًا في الشعبة نفسها','error'); return;
    }
    const btn=document.getElementById('saveStudent'); btn.classList.add('btn-loading'); btn.disabled=true;
    setTimeout(()=>{
      if(editing){
        Object.assign(s, draft);
      } else {
        draft.id = uid('stu'); draft.createdAt = daysAgoISO(0); draft.interventions=[];
        draft.level = 'السنة الأولى المشتركة';
        DB.data.students.push(draft);
      }
      DB.save();
      DB.data.auditLogs.unshift({id:uid('log'), time:daysAgoISO(0), user:S.user.name, action:(editing?'تحديث بيانات الطالب ':'إضافة طالب جديد ')+draft.name});
      trackUpdate(editing?'تحديث بيانات طالب':'إضافة طالب', draft.name);
      ov.remove();
      renderRoute();
      toast(editing? 'تم تحديث بيانات الطالب بنجاح':'تمت إضافة الطالب بنجاح');
    }, 400);
  };
  renderForm();
}

function schemeTableHTML(scheme){
  const totalW = CRITERIA.reduce((a,cr)=>a+n0(scheme.criteria[cr.key].weight),0);
  return `<div class="scrollx"><table class="scheme-table"><thead><tr><th>المعيار</th><th>الوزن من النسبة الكلية</th><th>الحد الأعظم للدرجة الخام</th><th>الآلية المختارة</th><th>طريقة حساب الدرجة</th></tr></thead><tbody>
    ${CRITERIA.map(cr=>{
      const c = scheme.criteria[cr.key], d = describeCriterion(c);
      return `<tr><td><b>${cr.label}</b></td><td>${fmtN(c.weight)}%</td><td>${fmtN(c.max)} ${cr.unit}</td><td><span class="tag-pill">${d.name}</span></td><td style="font-size:12.5px;line-height:1.9;">${d.html}</td></tr>`;
    }).join('')}
    <tr style="background:var(--surface-2);"><td><b>المجموع</b></td><td><b>${fmtN(totalW)}%</b></td><td colspan="3" class="table-sub">${Math.abs(totalW-100)<0.01 ? 'مجموع الأوزان 100%.' : 'مجموع الأوزان لا يساوي 100%؛ تُحسب النسبة الكلية من المجموع الفعلي للأوزان.'}</td></tr>
  </tbody></table></div>`;
}
function schemeMetaLine(scheme){
  if(!scheme.updatedAt) return '<span class="table-sub">المقياس الافتراضي للنظام (لم يعدّله المدرس بعد)</span>';
  return `<span class="table-sub">آخر تعديل للمقياس: ${fmtDateTime(scheme.updatedAt)}${scheme.updatedBy?' — '+escHtml(scheme.updatedBy):''}</span>`;
}
function thresholdsLine(){
  const st = DB.data.settings;
  return `حدود التصنيف: أخضر ≥ ${st.greenMin}% — أصفر ≥ ${st.yellowMin}% — أحمر أقل من ذلك — رمادي عند نسبة حضور ≤ ${st.grayAttendanceMax}%.`;
}
function sectionReportBody(sectionId, uniq){
  const sec = sectionOf(sectionId);
  if(!sec) return `<div class="card"><div class="empty">${ICON.alert}<div>لا توجد شعبة لعرض التقرير.</div></div></div>`;
  const c = courseOf(sec.courseId), inst = instructorOf(sec.instructorId);
  const students = studentsFor(c?c.id:'', sectionId);
  const scheme = getScheme(sectionId);
  const stats = computeStats(students);
  const rs = students.map(s=>({s, r:classify(s)}));
  const avgPct = key => rs.length ? Math.round(rs.reduce((a,x)=>a+x.r.parts[key].pct,0)/rs.length) : 0;
  const avgScore = rs.length ? Math.round(rs.reduce((a,x)=>a+x.r.score,0)/rs.length) : 0;
  return `<div class="card report-block" id="reportPrintArea${uniq!==undefined?'_'+uniq:''}" style="padding:24px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--primary-700);padding-bottom:14px;margin-bottom:16px;">
      <div><h2 style="font-family:Cairo;margin:0 0 4px;font-size:18px;">نظام معيار — تقرير أداء أكاديمي (${c?c.name:''})</h2><div class="table-sub">جامعة الملك سعود — السنة الأولى المشتركة — قسم العلوم الأساسية</div></div>
      <div style="text-align:left;font-size:11.5px;color:var(--text-muted);">تاريخ الإصدار<br><b>${daysAgoISO(0)}</b></div>
    </div>
    <div class="grid g-4" style="margin-bottom:16px;">
      ${infoBlock('الشعبة', sec.number)} ${infoBlock('المدرس', inst?inst.name:'')} ${infoBlock('الفصل الدراسي', sec.semester+' — '+sec.year)} ${infoBlock('عدد الطلبة', students.length)}
    </div>
    <div class="grid g-4" style="margin-bottom:16px;">
      ${miniStat('متوسط الدرجة الكلية', avgScore+'%')} ${miniStat('متوسط الحضور', stats.avgAttendance+'%')} ${miniStat('أخضر / أصفر', stats.green+' / '+stats.yellow)} ${miniStat('أحمر / رمادي', stats.red+' / '+stats.gray)}
    </div>

    <h4 class="font-head" style="font-size:14px;margin:18px 0 4px;">مقياس التقييم المعتمد من مدرس المقرر</h4>
    <div style="margin-bottom:8px;">${schemeMetaLine(scheme)}</div>
    ${schemeTableHTML(scheme)}
    <div class="table-sub" style="margin-top:8px;">${thresholdsLine()}</div>

    <h4 class="font-head" style="font-size:14px;margin:20px 0 8px;">متوسط تحقق كل معيار في الشعبة</h4>
    <div class="grid g-3" style="margin-bottom:6px;">
      ${CRITERIA.map(cr=>{ const d=describeCriterion(scheme.criteria[cr.key]); return miniStat(`${cr.label} — ${d.name}`, avgPct(cr.key)+'%'); }).join('')}
    </div>

    <h4 class="font-head" style="font-size:14px;margin:20px 0 8px;">قائمة الطلبة (الدرجة المكتسبة من وزن كل معيار)</h4>
    <div class="scrollx"><table><thead><tr><th>الرقم الجامعي</th><th>الاسم</th>
      ${CRITERIA.map(cr=>`<th>${cr.label}<div class="table-sub">من ${fmtN(scheme.criteria[cr.key].weight)}</div></th>`).join('')}
      <th>المجموع</th><th>الحالة</th></tr></thead><tbody>
      ${rs.length? rs.map(({s,r})=>`<tr><td>${escHtml(s.studentId)}</td><td>${escHtml(s.name)}</td>
        ${CRITERIA.map(cr=>`<td>${fmtN(r.parts[cr.key].earned)}</td>`).join('')}
        <td><b>${r.score}%</b></td><td>${badgeHTML(r.status)}</td></tr>`).join('')
        : `<tr><td colspan="${CRITERIA.length+4}"><div class="empty" style="padding:24px;">لا يوجد طلبة في هذه الشعبة بعد.</div></td></tr>`}
    </tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:18px;" class="no-print">
      <button class="btn btn-outline" onclick="window.print()">${ICON.print} طباعة</button>
      <button class="btn btn-outline" data-export-section="${sectionId}">${ICON.download} تصدير Excel</button>
    </div>
  </div>`;
}

/* ================================ Charts wiring ================================ */
function baseChartOpts(extra){
  const muted = getComputedStyle(document.body).getPropertyValue('--text-muted').trim() || '#475569';
  const border = getComputedStyle(document.body).getPropertyValue('--border').trim() || '#CBD5E1';
  return Object.assign({
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{display:false}, tooltip:{rtl:true, titleFont:{family:'Cairo'}, bodyFont:{family:'Tajawal'}} },
    scales: extra && extra.y ? { y:{ ticks:{color:muted, font:{size:10.5}}, grid:{color:border} }, x:{ ticks:{color:muted, font:{size:10.5}}, grid:{display:false} } } : {}
  }, extra||{});
}
function afterRouteRender(){
  wirePageEvents();
  const students = scopedStudents();
  const stats = computeStats(students);

  const classifyEl = document.getElementById('chartClassify');
  if(classifyEl){
    new Chart(classifyEl, { type:'doughnut',
      data:{ labels:['أخضر','أصفر','أحمر','رمادي'], datasets:[{ data:[stats.green,stats.yellow,stats.red,stats.gray],
        backgroundColor:[statusColor('green'),statusColor('yellow'),statusColor('red'),statusColor('gray')], borderWidth:0, spacing:2 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{legend:{display:false}} }
    });

  if(attEl){
    const labels = DB.data.courses.map(c=>c.name);

    new Chart(attEl, { type:'bar', data:{ labels, datasets:[{ data, backgroundColor: statusColor('green',.75), borderRadius:8, maxBarThickness:46 }] },
      options: baseChartOpts({y:{beginAtZero:true,max:100}}) });
  }
  const cmpEl = document.getElementById('chartCompare') || document.getElementById('chartCompareFull');
  if(cmpEl){
    const labels = DB.data.courses.map(c=>c.name);
    const rows = DB.data.courses.map(c=>computeStats(studentsFor(c.id)));
    new Chart(cmpEl, { type:'bar',

        {label:'أصفر %', data:rows.map(r=>r.yellowPct), backgroundColor: statusColor('yellow',.85), borderRadius:6},
        {label:'أحمر %', data:rows.map(r=>r.redPct), backgroundColor: statusColor('red',.85), borderRadius:6},
        {label:'رمادي %', data:rows.map(r=>r.grayPct), backgroundColor: statusColor('gray',.85), borderRadius:6},
      ]},
      options: baseChartOpts({y:{beginAtZero:true,max:100}, plugins:{legend:{display:true, position:'bottom', labels:{boxWidth:10, font:{size:11}}}}})
    });
  }
  const frEl = document.getElementById('chartFullReport');
  if(frEl){
    const labels = DB.data.courses.map(c=>c.name);
    const rows = DB.data.courses.map(c=>computeStats(studentsFor(c.id)));
    new Chart(frEl, { type:'bar', data:{ labels, datasets:[
      {label:'أخضر', data:rows.map(r=>r.green), backgroundColor: statusColor('green',.85), borderRadius:6},
      {label:'أصفر', data:rows.map(r=>r.yellow), backgroundColor: statusColor('yellow',.85), borderRadius:6},
      {label:'أحمر', data:rows.map(r=>r.red), backgroundColor: statusColor('red',.85), borderRadius:6},
      {label:'رمادي', data:rows.map(r=>r.gray), backgroundColor: statusColor('gray',.85), borderRadius:6},
    ]}, options: baseChartOpts({y:{beginAtZero:true}, plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:10,font:{size:11}}}}}) });
  }
}

function openSectionForm(id){
  const editing=!!id;
  const sec=editing ? DB.data.sections.find(x=>x.id===id) : {id:null,courseId:DB.data.courses[0]?.id||'',number:'',instructorId:DB.data.instructors[0]?.id||'',semester:'الأول',year:'1447هـ',status:'active'};
  if(!sec){toast('تعذر العثور على الشعبة','error');return;}
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="modal">
    <div class="modal-head"><h3 style="margin:0;font-family:Cairo;font-size:15px;">${editing?'تعديل الشعبة':'إضافة شعبة جديدة'}</h3><button type="button" class="icon-btn" id="sf_close">${ICON.x}</button></div>
    <div class="modal-body">
      <div class="grid g-2">
        <div class="field"><label>المقرر</label><select id="sf_course">${DB.data.courses.map(c=>`<option value="${c.id}" ${sec.courseId===c.id?'selected':''}>${c.name} — ${c.code}</option>`).join('')}</select></div>
        <div class="field"><label>رقم الشعبة</label><input id="sf_number" value="${sec.number||''}" placeholder="مثال: 101"></div>
        <div class="field"><label>المدرس</label><select id="sf_instructor">${DB.data.instructors.map(i=>`<option value="${i.id}" ${sec.instructorId===i.id?'selected':''}>${i.name}</option>`).join('')}</select></div>
        <div class="field"><label>الفصل الدراسي</label><input id="sf_semester" value="${sec.semester||'الأول'}"></div>
        <div class="field"><label>العام</label><input id="sf_year" value="${sec.year||'1447هـ'}"></div>
        <div class="field"><label>الحالة</label><select id="sf_status"><option value="active" ${sec.status==='active'?'selected':''}>نشطة</option><option value="inactive" ${sec.status==='inactive'?'selected':''}>غير نشطة</option></select></div>

    </div>

  </div>`;

/* ---------------- CSV / Excel Import and Export Handlers (Full Reset) ---------------- */
function normalizeExcelHeader(value){
  return String(value ?? '')
    .trim()
    .toLowerCase()
    .replace(/[أإآ]/g,'ا')
    .replace(/ة/g,'ه')
    .replace(/[ًٌٍَُِّْـ]/g,'')
    .replace(/\s+/g,' ');
}

function excelValue(row, aliases){
  const keys = Object.keys(row);
  for(const alias of aliases){
    const a = normalizeExcelHeader(alias);
    const key = keys.find(k=>normalizeExcelHeader(k)===a);
    if(key !== undefined && row[key] !== undefined && row[key] !== null && String(row[key]).trim()!=='') return row[key];
  }
  return '';
}

function parsePercentValue(v, fallback=0){
  const n = parseFloat(String(v ?? '').replace('%','').trim());
  return Number.isFinite(n) ? n : fallback;
}

function parseScoreValue(v, fallback=0){
  const m = String(v ?? '').trim().match(/^\s*(-?\d+(?:\.\d+)?)\s*(?:\/\s*(\d+(?:\.\d+)?))?\s*$/);
  if(!m) return fallback;
  return parseFloat(m[1]);
}

/* ================================ SCHEME EDITOR (معايير التقييم) ================================ */
function schemeSections(){
  const inst = currentInstructor();
  return inst ? DB.data.sections.filter(s=>s.id===inst.sectionId) : DB.data.sections;
}
function schemeDraftEnsure(){
  const list = schemeSections();
  let id = S.schemeDraft && S.schemeDraft.sectionId;
  if(!id || !list.find(s=>s.id===id)) id = list[0] ? list[0].id : '';
  if(!S.schemeDraft || S.schemeDraft.sectionId !== id){
    S.schemeDraft = { sectionId:id, scheme: cloneJSON(getScheme(id)), preview:{}, dirty:false };
  }
  return S.schemeDraft;
}
function weightSumBadge(sum){
  const ok = Math.abs(sum-100) < 0.01;
  return `<span class="badge ${ok?'b-green':'b-amber'}"><span class="dot"></span>${fmtN(sum)} / 100${ok?'':' — تُحسب النسبة الكلية من المجموع الفعلي'}</span>`;
}
function methodParamsHTML(cr, c){
  const k = cr.key;
  if(c.method==='cap') return `<div class="field" style="max-width:300px;"><label>حدّ الإتقان (% من الحد الأعظم)</label><input type="number" min="1" max="100" step="1" data-sc="capPct" data-k="${k}" value="${c.capPct}"><div class="table-sub" style="margin-top:4px;">يحصل الطالب على الوزن كاملًا عند بلوغ هذه النسبة.</div></div>`;
  if(c.method==='deduct') return `<div class="field" style="max-width:300px;"><label>الخصم لكل وحدة نقص (من الوزن)</label><input type="number" min="0" step="0.05" data-sc="perUnit" data-k="${k}" value="${c.perUnit}"><div class="table-sub" style="margin-top:4px;">يُخصم هذا المقدار عن كل ${cr.unit} ناقصة عن الحد الأعظم.</div></div>`;
  if(c.method==='bands'){
    const bands = Array.isArray(c.bands) ? c.bands : [];
    return `<div class="field"><label>الشرائح (تُطبَّق أعلى شريحة تحققت)</label>
      ${bands.map((b,i)=>`<div class="band-row"><span>إذا كانت النسبة ≥</span><input type="number" min="0" max="100" step="1" data-band="min" data-k="${k}" data-i="${i}" value="${b.min}"><span>% من الحد الأعظم ← يحصل على</span><input type="number" min="0" max="100" step="1" data-band="pct" data-k="${k}" data-i="${i}" value="${b.pct}"><span>% من الوزن</span><button type="button" class="iconbtn-sm" title="حذف الشريحة" data-band-del data-k="${k}" data-i="${i}">${ICON.trash}</button></div>`).join('')}
      <button type="button" class="btn btn-outline btn-sm" data-band-add data-k="${k}">${ICON.plus} إضافة شريحة</button></div>`;
  }
  if(c.method==='custom') return `<div class="field"><label>المعادلة (الناتج هو الدرجة المكتسبة من الوزن)</label>
    <input type="text" class="mono" data-sc="formula" data-k="${k}" value="${escHtml(c.formula)}" spellcheck="false" autocomplete="off">
    <div class="table-sub" style="margin-top:4px;line-height:1.9;">المتغيرات: <b class="mono">x</b> الدرجة الخام، <b class="mono">m</b> الحد الأعظم، <b class="mono">w</b> الوزن، <b class="mono">p</b> = x ÷ m. الدوال: <span class="mono">min max sqrt abs round floor ceil pow if(شرط, أ, ب)</span>.<br>أمثلة: <span class="mono">w * p</span> — <span class="mono">w * sqrt(p)</span> — <span class="mono">if(p &gt;= 0.9, w, w * p * 0.8)</span>. يُقيَّد الناتج بين صفر والوزن.</div>
    <div class="crit-err" id="sc_err_${k}"></div></div>`;
  return '';
}
function criterionCard(cr, d){
  const c = d.scheme.criteria[cr.key];
  const mOpts = Object.entries(METHODS).map(([k,v])=>`<option value="${k}" ${c.method===k?'selected':''}>${v.label}</option>`).join('');
  const pv = (d.preview[cr.key] !== undefined && Number.isFinite(d.preview[cr.key])) ? d.preview[cr.key] : Math.round(n0(c.max)*0.8*2)/2;
  return `<div class="card crit-card" data-crit="${cr.key}">
    <div class="crit-head"><div><h3 class="font-head" style="margin:0;font-size:15px;">${cr.label}</h3><div class="table-sub">عمود ملف Excel: ${cr.raw}</div></div><span class="tag-pill" id="sc_tag_${cr.key}"></span></div>
    <div class="grid g-3" style="margin-top:12px;">

      <div class="field"><label>آلية الحساب</label><select data-sc-method data-k="${cr.key}">${mOpts}</select></div>
    </div>
    ${methodParamsHTML(cr, c)}

    <div class="crit-preview">
      <span class="table-sub" style="font-weight:700;">جرّب قيمة خام:</span>

function schemeView(){
  const list = schemeSections();
  if(!list.length) return `<div class="card"><div class="empty">${ICON.alert}<div>لا توجد شعب لضبط معايير التقييم لها. أضف شعبة أولًا.</div></div></div>`;
  const d = schemeDraftEnsure();
  const sec = sectionOf(d.sectionId), crs = courseOf(sec.courseId), ins = instructorOf(sec.instructorId);
  const inst = currentInstructor();

      <div style="margin-inline-start:auto;"><div class="table-sub" style="font-weight:700;margin-bottom:4px;">مجموع الأوزان</div><div id="sc_wsum">${weightSumBadge(sum)}</div></div>
    </div>
    <div style="margin-top:10px;">${schemeMetaLine(getScheme(d.sectionId))}</div>
  </div>
  <div class="card" style="padding:12px 16px;margin-bottom:14px;font-size:12.5px;color:var(--text-muted);display:flex;gap:8px;align-items:flex-start;line-height:1.8;">${ICON.info}<div>لكل معيار وزن (من النسبة الكلية) وحدّ أعظم للدرجة الخام وآلية حساب يختارها المدرس. تُطبَّق التغييرات على جميع طلبة الشعبة فور الحفظ، وتظهر الآلية المختارة لكل معيار في تقرير الشعبة وفي ملف الطالب.</div></div>
  <div style="display:grid;gap:14px;">${CRITERIA.map(cr=>criterionCard(cr,d)).join('')}</div>

}
function refreshSchemeLive(){
  const d = S.schemeDraft; if(!d) return;
  let sum = 0;
  CRITERIA.forEach(cr=>{
    const c = d.scheme.criteria[cr.key]; sum += n0(c.weight);
    const ds = describeCriterion(c);
    const dEl = document.getElementById('sc_desc_'+cr.key); if(dEl) dEl.innerHTML = `<b>${ds.name}:</b><br>${ds.html}`;
    const x = (d.preview[cr.key] !== undefined && Number.isFinite(d.preview[cr.key])) ? d.preview[cr.key] : Math.round(n0(c.max)*0.8*2)/2;
    const r = evalCriterion(c, x);
    const out = document.getElementById('sc_pvout_'+cr.key);
    if(out) out.innerHTML = r.err ? `<span style="color:var(--red)">${escHtml(r.err)}</span>` : `${fmtN(r.earned)} من ${fmtN(r.weight)} (${Math.round(r.pct)}%)`;
    const tag = document.getElementById('sc_tag_'+cr.key); if(tag) tag.textContent = `الوزن ${fmtN(c.weight)}%`;
    const eEl = document.getElementById('sc_err_'+cr.key);
    if(eEl){
      const rr = runFormula(c.formula, {x:n0(c.max)*0.5, m:n0(c.max), w:n0(c.weight), p:0.5});
      eEl.textContent = rr.error ? ('⚠ '+rr.error) : '';
    }
  });
  const ws = document.getElementById('sc_wsum'); if(ws) ws.innerHTML = weightSumBadge(sum);
}
function validateScheme(sc){
  const errs = []; let sumW = 0;
  CRITERIA.forEach(cr=>{
    const c = sc.criteria[cr.key];
    const w = parseFloat(c.weight), m = parseFloat(c.max);
    if(!Number.isFinite(w) || w < 0) errs.push(`${cr.label}: الوزن غير صالح`); else sumW += w;
    if(!Number.isFinite(m) || m <= 0) errs.push(`${cr.label}: الحد الأعظم يجب أن يكون أكبر من صفر`);
    if(c.method==='bands'){
      if(!(c.bands && c.bands.length)) errs.push(`${cr.label}: أضف شريحة واحدة على الأقل`);
      else if(c.bands.some(b=>!Number.isFinite(parseFloat(b.min)) || !Number.isFinite(parseFloat(b.pct)))) errs.push(`${cr.label}: قيم الشرائح غير مكتملة`);
    }
    if(c.method==='cap'){ const cp = parseFloat(c.capPct); if(!(cp>0 && cp<=100)) errs.push(`${cr.label}: حدّ الإتقان يجب أن يكون بين 1 و100`); }
    if(c.method==='deduct' && !(parseFloat(c.perUnit) >= 0)) errs.push(`${cr.label}: قيمة الخصم غير صالحة`);
    if(c.method==='custom'){
      const r = runFormula(c.formula, {x:n0(c.max)*0.5, m:n0(c.max), w:n0(c.weight), p:0.5});
      if(r.error) errs.push(`${cr.label}: ${r.error}`);
    }
  });
  if(sumW <= 0) errs.push('مجموع الأوزان يجب أن يكون أكبر من صفر');
  return errs;
}
function wireSchemePage(){
  if(S.route !== 'scheme' || !S.schemeDraft) return;
  const d = S.schemeDraft;
  const sel = document.getElementById('sc_section');
  if(sel) sel.onchange = ()=>{
    const target = sel.value;
    const go2 = ()=>{ S.schemeDraft = { sectionId:target, scheme:cloneJSON(getScheme(target)), preview:{}, dirty:false }; renderRoute(); };
    if(d.dirty){
      sel.value = d.sectionId;
      confirmDialog({title:'تغييرات غير محفوظة', message:'لديك تعديلات لم تُحفظ على هذه الشعبة. هل تريد تجاهلها والانتقال إلى شعبة أخرى؟', confirmText:'تجاهل وانتقال', danger:false, onConfirm:go2});
    } else go2();
  };
  document.querySelectorAll('[data-sc]').forEach(el=> el.oninput = ()=>{
    const c = d.scheme.criteria[el.dataset.k], f = el.dataset.sc;
    c[f] = (f==='formula') ? el.value : (el.value==='' ? '' : parseFloat(el.value));
    d.dirty = true; refreshSchemeLive();
  });
  document.querySelectorAll('[data-sc-method]').forEach(el=> el.onchange = ()=>{
    d.scheme.criteria[el.dataset.k].method = el.value; d.dirty = true; renderRoute();
  });
  document.querySelectorAll('[data-band]').forEach(el=> el.oninput = ()=>{
    const b = d.scheme.criteria[el.dataset.k].bands[+el.dataset.i];
    b[el.dataset.band] = el.value==='' ? '' : parseFloat(el.value); d.dirty = true; refreshSchemeLive();
  });
  document.querySelectorAll('[data-band-del]').forEach(el=> el.onclick = ()=>{
    d.scheme.criteria[el.dataset.k].bands.splice(+el.dataset.i,1); d.dirty = true; renderRoute();
  });
  document.querySelectorAll('[data-band-add]').forEach(el=> el.onclick = ()=>{
    d.scheme.criteria[el.dataset.k].bands.push({min:0,pct:0}); d.dirty = true; renderRoute();
  });
  document.querySelectorAll('[data-pv]').forEach(el=> el.oninput = ()=>{
    d.preview[el.dataset.pv] = parseFloat(el.value); refreshSchemeLive();
  });
  const finalize = ()=>{
    const sc = cloneJSON(d.scheme);
    CRITERIA.forEach(cr=>{
      const c = sc.criteria[cr.key];
      ['weight','max','capPct','perUnit'].forEach(f=>{ c[f] = parseFloat(c[f]); });
      c.bands = (c.bands||[]).map(b=>({min:parseFloat(b.min), pct:parseFloat(b.pct)}));
    });
    return sc;
  };
  const save = document.getElementById('sc_save');
  if(save) save.onclick = ()=>{
    const errs = validateScheme(d.scheme);
    if(errs.length){ toast(errs[0] + (errs.length>1 ? ` (+${errs.length-1} ملاحظات أخرى)` : ''), 'error'); return; }
    const sc = finalize();
    saveScheme(d.sectionId, sc);
    const sec = sectionOf(d.sectionId);
    DB.data.auditLogs.unshift({id:uid('log'), time:daysAgoISO(0), user:S.user.name, action:'تعديل معايير التقييم للشعبة '+(sec?sec.number:'')});
    trackUpdate('تعديل معايير التقييم', sec?('شعبة '+sec.number):'');
    S.schemeDraft = { sectionId:d.sectionId, scheme:cloneJSON(getScheme(d.sectionId)), preview:d.preview, dirty:false };
    renderRoute();
    const sum = CRITERIA.reduce((a,cr)=>a+n0(sc.criteria[cr.key].weight),0);
    toast(Math.abs(sum-100)<0.01 ? 'تم حفظ معايير التقييم وتطبيقها على طلبة الشعبة' : 'تم الحفظ — تنبيه: مجموع الأوزان ليس 100%', Math.abs(sum-100)<0.01 ? 'success' : 'warn');
  };
  const reset = document.getElementById('sc_reset');
  if(reset) reset.onclick = ()=> confirmDialog({title:'استعادة الإعدادات الافتراضية', message:'سيتم استبدال المعايير المعروضة بالمقياس الافتراضي (نسبي مباشر لجميع المعايير). لن تُحفظ التغييرات حتى تضغط «حفظ».', confirmText:'استعادة', danger:false, onConfirm:()=>{
    const keepMaxAttendance = d.scheme.criteria.attendance.max;
    d.scheme = cloneJSON(DEFAULT_SCHEME); d.scheme.criteria.attendance.max = keepMaxAttendance; d.dirty = true; d.preview = {}; renderRoute();
  }});
  const copy = document.getElementById('sc_copy');
  if(copy) copy.onclick = ()=>{
    const errs = validateScheme(d.scheme);
    if(errs.length){ toast(errs[0], 'error'); return; }
    const sec = sectionOf(d.sectionId);
    const targets = DB.data.sections.filter(s=>s.courseId===sec.courseId && s.id!==sec.id);
    confirmDialog({title:'تطبيق على كل شعب المقرر', message:`سيتم استبدال مقياس التقييم في ${targets.length} شعبة أخرى من المقرر نفسه بالمقياس المعروض الآن (وسيُحفظ المقياس الحالي أيضًا). هل تريد المتابعة؟`, confirmText:'تطبيق', danger:false, onConfirm:()=>{
      const sc = finalize();
      saveScheme(d.sectionId, sc);
      targets.forEach(t=> saveScheme(t.id, sc));
      DB.data.auditLogs.unshift({id:uid('log'), time:daysAgoISO(0), user:S.user.name, action:'تعميم معايير التقييم على شعب المقرر '+((courseOf(sec.courseId)||{}).name||'')});
      S.schemeDraft = { sectionId:d.sectionId, scheme:cloneJSON(getScheme(d.sectionId)), preview:d.preview, dirty:false };
      renderRoute(); toast('تم تعميم معايير التقييم على شعب المقرر');
    }});
  };
  refreshSchemeLive();
}

/* ================================ Excel: قالب / تصدير / استيراد ================================ */
/* أعمدة ملف الاستيراد (بالترتيب المعتمد). تُقبل عدة صيغ لعناوين الأعمدة. */
const IMPORT_COLUMNS = [
  {key:'studentId',  label:'الرقم الجامعي',       aliases:['الرقم الجامعي','الرقم الاكاديمي','رقم الطالب','الرقم','student id','studentid','id']},
  {key:'name',       label:'اسم الطالب',          aliases:['اسم الطالب','الاسم','اسم','student name','studentname','name']},
  {key:'attendance', label:'عدد ساعات الحضور',    aliases:['عدد ساعات الحضور','ساعات الحضور','عدد الساعات','الحضور','attendance hours','attendance']},
  {key:'activities', label:'درجة الأنشطة',        aliases:['درجة الأنشطة','درجة الانشطة','الأنشطة','الانشطة','activities','activity']},
  {key:'exercises',  label:'درجة التمارين',       aliases:['درجة التمارين','التمارين','exercises','exercise']},
  {key:'homework',   label:'درجة الواجب الورقي',  aliases:['درجة الواجب الورقي','الواجب الورقي','درجة الواجب','الواجب','homework','paper homework']},
  {key:'midterm',    label:'درجة المنتصف',        aliases:['درجة المنتصف','درجة اختبار المنتصف','المنتصف','الاختبار النصفي','midterm']},
  {key:'evaluation', label:'تقييم المدرس',        aliases:['تقييم المدرس','تقييم المدرّس','التقييم','evaluation','instructor evaluation']},
];
function findHeader(keys, aliases){
  for(const a of aliases){
    const n = normalizeExcelHeader(a);
    const k = keys.find(x=>normalizeExcelHeader(x)===n);
    if(k !== undefined) return k;
  }
  return null;
}
function normDigits(s){
  return String(s ?? '').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
}
function toNum(v){
  if(typeof v === 'number') return Number.isFinite(v) ? v : NaN;
  let s = normDigits(v).trim();
  if(!s) return NaN;
  s = s.replace(/٫/g,'.').replace(/٬/g,'');
  if(!s.includes('.')) s = s.replace(',','.'); else s = s.replace(/,/g,'');
  const m = s.match(/-?\d+(?:\.\d+)?/);
  return m ? parseFloat(m[0]) : NaN;
}
function normStudentId(v){
  if(typeof v === 'number') return String(Math.trunc(v));
  return normDigits(v).trim().replace(/\.0+$/,'');
}

function exportRows(students){
  return students.map(s=>{
    const r = classify(s), c = courseOf(s.courseId), sec = sectionOf(s.sectionId), sc = s.scores || {};
    const row = {};
    row['الرقم الجامعي'] = s.studentId ?? '';
    row['اسم الطالب'] = s.name ?? '';
    CRITERIA.forEach(cr=>{ row[IMPORT_COLUMNS.find(x=>x.key===cr.key).label] = n0(sc[cr.key]); });
    row['المقرر'] = c?.name ?? '';
    row['الشعبة'] = sec?.number ?? '';
    row['المدرس'] = instructorOf(sec?.instructorId)?.name ?? '';
    CRITERIA.forEach(cr=>{ row['المكتسب — '+cr.label] = Math.round(r.parts[cr.key].earned*100)/100; });
    row['المجموع %'] = r.score;
    row['الحالة'] = STATUS_LABEL[r.status] ?? r.status ?? '';
    return row;
  });
}
function exportSchemeRows(students){
  const secIds = [...new Set(students.map(s=>s.sectionId))];
  const out = [];
  secIds.forEach(id=>{
    const sec = sectionOf(id), c = courseOf(sec?.courseId), sc = getScheme(id);
    CRITERIA.forEach(cr=>{
      const cc = sc.criteria[cr.key], d = describeCriterion(cc);
      out.push({'المقرر':c?.name??'', 'الشعبة':sec?.number??'', 'المعيار':cr.label, 'الوزن %':cc.weight, 'الحد الأعظم':cc.max, 'الآلية':d.name, 'طريقة الحساب':d.plain});
    });
  });
  return out;
}
function exportStudentsExcel(students){
  if(!students || !students.length){ toast('لا توجد بيانات طلاب لتصديرها.', 'warn'); return; }
  const rows = exportRows(students);
  if(typeof XLSX === 'undefined'){
    exportStudentsCSVFallback(rows);
    toast('تم تصدير البيانات بصيغة CSV لأن مكتبة Excel غير متاحة.', 'warn');
    return;
  }
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = Object.keys(rows[0]).map((k,i)=>({wch: i===1?30 : i<8?18 : 16}));
  const ws2 = XLSX.utils.json_to_sheet(exportSchemeRows(students));
  ws2['!cols'] = [{wch:28},{wch:10},{wch:18},{wch:10},{wch:12},{wch:22},{wch:70}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الطلبة');
  XLSX.utils.book_append_sheet(wb, ws2, 'مقياس التقييم');
  wb.Workbook = { Views:[{RTL:true}] };
  XLSX.writeFile(wb, `تقرير_معيار_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast(`تم تصدير ${rows.length} طالبًا إلى ملف Excel بنجاح`);
}
function exportStudentsCSVFallback(rows){
  const esc = v=>`"${String(v ?? '').replace(/"/g,'""')}"`;
  const keys = Object.keys(rows[0]);
  const lines = [keys.map(esc).join(',')].concat(rows.map(r=>keys.map(k=>esc(r[k])).join(',')));
  const blob = new Blob(['\uFEFF'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = `تقرير_معيار_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportCSV(students){ exportStudentsExcel(students); }

function downloadStudentsTemplate(){
  if(typeof XLSX === 'undefined'){ toast('مكتبة Excel غير متاحة. تحقق من اتصال الإنترنت.', 'error'); return; }
  const headers = IMPORT_COLUMNS.map(c=>c.label);
  const ws = XLSX.utils.aoa_to_sheet([headers, ['2044001','مثال: عبدالله محمد',26,9,13,8,24,17], ['2044002','مثال: سارة أحمد',22,8,12,9,27,18]]);
  ws['!cols'] = [{wch:16},{wch:28},{wch:18},{wch:14},{wch:14},{wch:20},{wch:14},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الطلبة');
